<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端互動測驗平台 - 中世紀音樂史</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // --- 匯入 React 與 Lucide 元件 ---
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Play, Square, Clock, Users, CheckCircle, ChevronRight, 
      ChevronLeft, Eye, ListChecks, ArrowRight, UserCircle, 
      LogOut, RefreshCw, Copy, Link as LinkIcon, Send, 
      Download, Upload, AlertTriangle 
    } from 'https://esm.sh/lucide-react@0.292.0';

    // Firebase 服務匯入
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // --- 完整 20 題資料庫 ---
    const DEFAULT_QUIZ_BANKS = {
      "basic": {
        "name": "中世紀音樂史 - 初階測驗 (10題)",
        "questions": [
          { "id": 1, "question": "請問「格雷果聖歌」在音樂形式、旋律發展與歌詞語言上有哪些主要特色？", "answer": "格雷果聖歌是一種「單曲調音樂」（Monophony），即只有單一聲部，且沒有對位、和聲或伴奏；其旋律發展以音與音之間相鄰二度關係的「級進」為主，音域狹窄，聽起來平穩莊嚴；歌詞部分則是使用拉丁文寫成。" },
          { "id": 2, "question": "什麼是多利安調式（Dorian Mode）？它在譜面上最主要的特徵是什麼？", "answer": "多利安調式是中世紀的「教會調式」之一；它的最主要特徵，是樂曲的每一個句子最終都會結束在第一線的「Re」音上。" },
          { "id": 3, "question": "關於格雷果聖歌中歌詞與曲調的搭配關係，請簡述「音節式」、「紐姆式」與「花彩式」三者的差異。", "answer": "差異在於音節與音高的對應數量：音節式(一字一音)、紐姆式(一字對應數音)、花彩式(一字對應非常多音)。" },
          { "id": 4, "question": "在現代五線譜廣泛使用前，中世紀的紐姆譜（四線譜）是如何精確標示音高的？", "answer": "紐姆譜主要是透過先設定一條基準線，並在該線上標示「譜號」（例如 C 譜號或 F 譜號）來約定音高，再以此基準推算相對音高。" },
          { "id": 5, "question": "「奧干農」 (Organum) 是什麼？它在西方音樂史上有何重要地位？", "answer": "奧干農是中世紀早期的「複音音樂」形式，在既有的格雷果聖歌基礎上加上第二聲部。它是西方多聲部和聲與對位法發展的起源。" },
          { "id": 6, "question": "何謂「單音音樂」 (Monophony)？", "answer": "單音音樂指的是只有單一旋律線條，沒有任何和聲、對位或伴奏聲部的音樂形式。格雷果聖歌即是其代表。" },
          { "id": 7, "question": "中世紀活躍於法國各地的「遊吟詩人」 (Troubadours) 的音樂有何主要特色？", "answer": "屬於世俗音樂，使用地方方言，主題圍繞騎士之愛或宮廷故事，且演唱時通常會有各種民間樂器伴奏。" },
          { "id": 8, "question": "為什麼中世紀初期的教會音樂強烈排斥使用樂器？", "answer": "教會認為器樂容易讓人聯想到異教徒祭典或世俗娛樂，主張「人聲」才是神所創造最完美、最純潔的樂器。" },
          { "id": 9, "question": "天主教「彌撒曲」 (Mass) 中，每次儀式都固定不變的「固定聲部」 (Ordinary) 包含哪五個主要段落？", "answer": "1. Kyrie, 2. Gloria, 3. Credo, 4. Sanctus/Benedictus, 5. Agnus Dei。" },
          { "id": 10, "question": "什麼是「經文歌」 (Motet)？它最初是如何發展出來的？", "answer": "經文歌最早從奧干農的花彩式段落（克勞蘇拉）發展而來，音樂家開始在原本沒有歌詞的上方聲部填寫新歌詞而形成。" }
        ]
      },
      "advanced": {
        "name": "中世紀音樂史 - 進階測驗 (10題)",
        "questions": [
          { "id": 1, "question": "「貴多之手（Guidonian Hand）」的主要用途與運作邏輯為何？", "answer": "它是教導音名、唱名與轉調的工具。手上標示了所有絕對音名，展示三組「六音音階」的重疊關係，幫助學生轉換唱名達成轉調。" },
          { "id": 2, "question": "為什麼早期唱名系統中只有「Ut、Re、Mi、Fa、Sol、La」而沒有包含「Si」？", "answer": "因為當時是建立在「六音音階」基礎上，音域超過範圍時只需在音階間切換，當時的理論系統下並不需要第七個音。" },
          { "id": 3, "question": "現代唱名「Si」大約在何時誕生？是為了因應什麼樣的需求？", "answer": "約 16 至 17 世紀誕生。因應多聲部音樂發展，需要一個距離主音只有半音的「導音」來解決樂句結尾的安定感。" },
          { "id": 4, "question": "「紐特丹樂派」 (Notre Dame School) 對西方複音音樂最大的貢獻是什麼？代表人物有誰？", "answer": "最大貢獻是發展出西方第一套精確測量音符長短的「節奏調式」系統。代表人物為 Léonin 與 Pérotin。" },
          { "id": 5, "question": "什麼是「等節奏」 (Isorhythm) 手法？", "answer": "將一段固定的節奏模式 (Talea) 與一段旋律模式 (Color) 結合，並在定旋律聲部中不斷反覆，製造出極具數學邏輯的結構。" },
          { "id": 6, "question": "十四世紀「新藝術」 (Ars Nova) 在節奏與記譜上有何重大觀念突破？", "answer": "正式允許二拍子(不完美)與三拍子享有同等地位，並發明更細微的音符時值(Minima)，增加節奏的豐富性。" },
          { "id": 7, "question": "馬肖 (Guillaume de Machaut) 創作的《聖母彌撒曲》具有什麼跨時代的歷史意義？", "answer": "是史上第一部由「單一位作曲家」將彌撒曲五個固定聲部完整譜寫成一體的多聲部作品，展現高度統一性。" },
          { "id": 8, "question": "什麼是「定旋律」 (Cantus Firmus) 作曲手法？", "answer": "作曲家借用一段現成旋律(如聖歌)放慢速度作為基礎聲部(Tenor)，其他聲部圍繞其發展對位與和聲。" },
          { "id": 9, "question": "中世紀末期「勃艮第樂派」在和聲聽覺上帶來了什麼改變？", "answer": "大量使用「三度與六度」不完全協和音程，取代中世紀那種空洞剛硬的和聲，使聽覺更加飽滿、甜美。" },
          { "id": 10, "question": "「假低音」 (Fauxbourdon) 的演唱方式與和聲特色為何？", "answer": "一種即興和聲技巧。樂譜上寫兩個平行聲部，演唱者在最高聲部下方四度即興唱出第三聲部，聽起來像連續的六和弦進行。" }
        ]
      }
    };

    // --- Firebase 配置 (真實金鑰) ---
    const firebaseConfig = {
      apiKey: "AIzaSyC4jSIve5kj15hSptVFJ2hOdEjcQ0GsR6w",
      authDomain: "musictest-1c0fb.firebaseapp.com",
      projectId: "musictest-1c0fb",
      storageBucket: "musictest-1c0fb.firebasestorage.app",
      messagingSenderId: "416438714609",
      appId: "1:416438714609:web:806f72c2e2d40804442950",
      measurementId: "G-8NZLQDYY1N"
    };
    
    const appId = 'medieval-quiz-app-final';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- 主程式主體 ---
    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [session, setSession] = useState(null);
      const [answers, setAnswers] = useState([]);
      const [error, setError] = useState('');
      const [toast, setToast] = useState('');

      const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 3000); };

      useEffect(() => {
        signInAnonymously(auth).catch(e => setError("連線失敗，請檢查匿名登入是否啟用。"));
        onAuthStateChanged(auth, setUser);
      }, []);

      useEffect(() => {
        if (!user || !code) return;
        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);
        const unsubS = onSnapshot(sRef, (d) => {
          if (d.exists()) setSession(d.data());
          else if (role === 'student') { setRole(null); setCode(''); setError('測驗室已關閉。'); }
        });
        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAnswers(docs.filter(a => a.sessionId === code));
        });
        return () => { unsubS(); unsubA(); };
      }, [user, code, role]);

      const handleCreate = async () => {
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, status: 'lobby', quizBankId: 'basic', quizTitle: DEFAULT_QUIZ_BANKS['basic'].name,
            questions: DEFAULT_QUIZ_BANKS['basic'].questions, currentQuestionIndex: 0, perQuestionTime: 60,
            totalQuizTime: 15, autoAdvance: false, revealedAnswers: [], revealAll: false, createdAt: Date.now()
          });
          setCode(newCode); setRole('instructor');
        } catch (e) { setError(`建立失敗：${e.message}`); }
      };

      const handleJoin = async (c, n) => {
        if (!c || !n) return setError('請填寫姓名與代碼');
        const cU = c.trim().toUpperCase();
        const safeN = n.trim().replace(/[\/\.#$\[\]]/g, '_');
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', cU));
          if (!snap.exists()) return setError('找不到該代碼');
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${cU}_${user.uid}_${safeN}`), {
            sessionId: cU, studentId: `${user.uid}_${safeN}`, studentName: safeN, answers: {}, score: 0
          }, { merge: true });
          setCode(cU); setName(safeN); setRole('student');
        } catch (e) { setError('加入失敗，請檢查資料庫規則。'); }
      };

      if (error) return <div className="h-screen flex items-center justify-center p-6"><div className="bg-white p-8 rounded-2xl shadow-xl border border-red-200 text-center"><AlertTriangle className="mx-auto text-red-500 mb-4" /><p className="mb-4">{error}</p><button onClick={()=>setError('')} className="bg-indigo-600 text-white px-6 py-2 rounded-lg">重試</button></div></div>;
      if (!user) return <div className="h-screen flex items-center justify-center animate-pulse text-slate-400">系統連線中...</div>;

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          <header className="bg-indigo-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
            <h1 className="font-bold flex items-center gap-2"><ListChecks /> 雲端互動測驗系統</h1>
            {role && <div className="bg-indigo-800 px-4 py-1.5 rounded-full text-xs flex items-center gap-4">
              <span>{role==='instructor'?'講師模式':'學生: '+name}</span><span className="font-mono font-bold text-yellow-300">代碼: {code}</span>
              <button onClick={()=>{setRole(null); setCode('');}} className="bg-red-500 hover:bg-red-600 px-2 py-0.5 rounded text-xs transition-colors">離開</button>
            </div>}
          </header>
          <main className="flex-1 max-w-6xl mx-auto p-4 md:p-8 w-full">
            {!role && <Lobby onJoin={handleJoin} onCreate={handleCreate} />}
            {role === 'instructor' && session && <Instructor code={code} session={session} answers={answers} db={db} showToast={showToast} />}
            {role === 'student' && session && <Student session={session} myData={answers.find(a=>a.studentId===`${user.uid}_${name}`)} onSave={(i,t)=>{
               updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${code}_${user.uid}_${name}`), { [`answers.${i}`]: t });
            }} />}
          </main>
          {toast && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full flex items-center gap-2 animate-bounce z-50 shadow-2xl"><CheckCircle className="text-green-400 w-4 h-4" /> {toast}</div>}
        </div>
      );
    }

    // --- 入口組件 ---
    function Lobby({ onJoin, onCreate }) {
      const [c, setC] = useState(''); const [n, setN] = useState('');
      useEffect(() => { const uc = new URLSearchParams(window.location.search).get('code'); if(uc) setC(uc.toUpperCase()); }, []);
      return (
        <div className="grid md:grid-cols-2 gap-8 mt-10">
          <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
            <h2 className="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 學生加入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="您的姓名" className="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" value={n} onChange={e=>setN(e.target.value)} />
              <input type="text" placeholder="測驗代碼" className="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-mono" value={c} onChange={e=>setC(e.target.value)} />
              <button onClick={()=>onJoin(c,n)} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">進入測驗</button>
            </div>
          </div>
          <div className="bg-gradient-to-br from-indigo-50 to-white p-8 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col justify-center">
            <h2 className="text-2xl font-bold mb-4 flex items-center gap-2 text-slate-800"><Users /> 講師管理</h2>
            <p className="text-slate-500 mb-8 leading-relaxed">建立虛擬互動測驗室，即時切換題目、計時並同步監看全體學生的作答狀態。</p>
            <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl hover:bg-slate-900 transition-all">建立新教室</button>
          </div>
        </div>
      );
    }

    // --- 講師組件 ---
    function Instructor({ code, session, answers, db, showToast }) {
      const qRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);
      const handleNext = () => {
        if (session.currentQuestionIndex < session.questions.length - 1) {
          updateDoc(qRef, { currentQuestionIndex: session.currentQuestionIndex + 1, questionEndTime: Date.now() + session.perQuestionTime * 1000 });
        } else { updateDoc(qRef, { status: 'review', questionEndTime: null, currentQuestionIndex: 0 }); }
      };

      useEffect(() => {
        let t; if (session.status === 'sync_active' && session.autoAdvance && session.questionEndTime) {
          const d = session.questionEndTime - Date.now();
          if (d <= 0) handleNext(); else t = setTimeout(handleNext, d);
        } return () => clearTimeout(t);
      }, [session.status, session.currentQuestionIndex, session.questionEndTime, session.autoAdvance]);

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-indigo-900">控制面板</h2>
              <div className="flex gap-4">
                {session.status==='sync_active' && <Timer endTime={session.questionEndTime} label="當前題倒數" />}
                <Timer endTime={session.totalEndTime} label="總剩餘時間" />
              </div>
            </div>
            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-8 border-t pt-6">
                <div className="space-y-4">
                  <div className="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 flex gap-2">
                    <input readOnly className="flex-1 bg-white text-xs p-2 rounded border font-mono" value={`${window.location.origin}${window.location.pathname}?code=${code}`} />
                    <button onClick={()=>{navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?code=${code}`); showToast('連結已複製');}} className="bg-indigo-600 text-white px-4 py-1 rounded-lg text-xs font-bold transition-transform active:scale-95">複製邀請網址</button>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-[10px] font-bold text-slate-400 ml-1">每題秒數</label>
                      <input type="number" className="w-full p-3 border rounded-xl bg-slate-50" value={session.perQuestionTime} onChange={e=>updateDoc(qRef,{perQuestionTime:Number(e.target.value)})} />
                    </div>
                    <div className="space-y-1">
                      <label className="text-[10px] font-bold text-slate-400 ml-1">跳題方式</label>
                      <select className="w-full p-3 border rounded-xl bg-slate-50" value={session.autoAdvance} onChange={e=>updateDoc(qRef,{autoAdvance:e.target.value==='true'})}>
                        <option value="false">手動</option><option value="true">自動</option>
                      </select>
                    </div>
                  </div>
                  <select className="w-full p-3 border rounded-xl bg-slate-50 font-bold" value={session.quizBankId} onChange={e=>updateDoc(qRef,{quizBankId:e.target.value, quizTitle: DEFAULT_QUIZ_BANKS[e.target.value].name, questions: DEFAULT_QUIZ_BANKS[e.target.value].questions})}>
                    {Object.entries(DEFAULT_QUIZ_BANKS).map(([id,b])=><option key={id} value={id}>{b.name}</option>)}
                  </select>
                </div>
                <div className="flex flex-col justify-center gap-3">
                  <button onClick={()=>updateDoc(qRef,{status:'sync_active',currentQuestionIndex:0,totalEndTime:Date.now()+session.totalQuizTime*60000,questionEndTime:Date.now()+session.perQuestionTime*1000})} disabled={answers.length===0} className="bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg disabled:bg-slate-300 transition-all">啟動 同步測驗模式</button>
                  <button onClick={()=>updateDoc(qRef,{status:'async_active',totalEndTime:Date.now()+session.totalQuizTime*60000})} disabled={answers.length===0} className="bg-white border-2 border-indigo-600 text-indigo-700 py-4 rounded-2xl font-bold disabled:opacity-30">啟動 學生自配速模式</button>
                  {answers.length===0 && <p className="text-center text-xs text-red-500 font-bold animate-pulse">（等待學生加入後即可開始）</p>}
                </div>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-5 rounded-2xl shadow-xl">
                <p className="font-bold flex items-center gap-2"><Play className="w-4 h-4 fill-indigo-400"/> 測驗中：{session.quizTitle}</p>
                <div className="flex gap-3">
                  {session.status==='sync_active' && <button onClick={handleNext} className="bg-white text-indigo-900 px-8 py-2 rounded-xl font-bold hover:bg-indigo-50 transition-colors">{session.currentQuestionIndex<session.questions.length-1?'發布下一題':'結束並進入檢討'}</button>}
                  <button onClick={()=>updateDoc(qRef,{status:'review',questionEndTime:null,currentQuestionIndex:0})} className="bg-red-500 text-white px-8 py-2 rounded-xl font-bold hover:bg-red-600">強制結束</button>
                </div>
              </div>
            )}
          </div>

          <div className="grid lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 space-y-6">
              <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <div className="flex justify-between items-center border-b pb-4 mb-6">
                  <h3 className="text-xl font-bold text-slate-800">Q{session.currentQuestionIndex + 1} 題目預覽</h3>
                  {session.status==='review' && (
                    <div className="flex gap-2">
                      <button onClick={()=>{
                        const cur = session.currentQuestionIndex; const newR = session.revealedAnswers.includes(cur)?session.revealedAnswers.filter(i=>i!==cur):[...session.revealedAnswers,cur];
                        updateDoc(qRef,{revealedAnswers:newR});
                      }} className="text-xs bg-slate-100 p-2 rounded border font-bold">公開本題解答</button>
                    </div>
                  )}
                </div>
                <p className="text-2xl font-bold text-slate-700 leading-relaxed mb-8">{session.questions?.[session.currentQuestionIndex]?.question}</p>
                <div className="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 text-sm shadow-inner italic">
                  <h4 className="font-bold text-emerald-600 mb-2">標準答案內容：</h4>
                  <p className="text-emerald-900 whitespace-pre-wrap">{session.questions?.[session.currentQuestionIndex]?.answer}</p>
                </div>
                {(session.status === 'review' || session.status === 'async_active') && (
                  <div className="mt-8 flex flex-wrap gap-2 pt-6 border-t">
                    {session.questions.map((_,i)=><button key={i} onClick={()=>updateDoc(qRef, {currentQuestionIndex: i})} className={`w-10 h-10 rounded-2xl font-bold transition-all ${session.currentQuestionIndex===i?'bg-indigo-600 text-white shadow-lg scale-110':'bg-slate-100 text-slate-400'}`}>{i+1}</button>)}
                  </div>
                )}
              </div>
            </div>
            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 h-[650px] flex flex-col">
              <h3 className="text-lg font-bold flex items-center gap-2 border-b pb-4 text-slate-700 mb-4"><Users className="text-indigo-600"/> 在線學生 ({answers.length}人)</h3>
              <div className="flex-1 overflow-y-auto space-y-3 custom-scrollbar pr-1">
                {answers.map(s => (
                  <div key={s.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-100 transition-colors hover:bg-indigo-50/50">
                    <div className="flex justify-between items-center mb-2">
                      <span className="font-bold text-indigo-900">{s.studentName}</span>
                      {session.status==='review' && <div className="flex items-center gap-1 bg-white px-2 rounded-lg border border-indigo-100"><span className="text-[8px] font-bold text-slate-400 uppercase">SCORE</span><input type="number" className="w-8 p-0 text-center font-bold text-indigo-600 outline-none bg-transparent" value={s.score||0} onChange={e=>updateDoc(doc(db,'artifacts',appId,'public', 'data', 'answers', s.id),{score:Number(e.target.value)})} /></div>}
                    </div>
                    <p className="text-xs text-slate-500 bg-white p-3 rounded-xl border border-indigo-50 shadow-inner italic line-clamp-3">
                      {s.answers[session.currentQuestionIndex] || '（未作答）'}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 學生組件 ---
    function Student({ session, myData, onSave }) {
      const [lIdx, setLIdx] = useState(0);
      const activeIdx = session.status === 'sync_active' ? session.currentQuestionIndex : lIdx;
      const q = session.questions?.[activeIdx] || {};
      const [txt, setTxt] = useState(''); const [ok, setOk] = useState(false);

      useEffect(() => { if(myData) setTxt(myData.answers[activeIdx] || ''); }, [activeIdx, myData]);
      useEffect(() => { if(session.status==='sync_active') setLIdx(session.currentQuestionIndex); }, [session.currentQuestionIndex]);

      const save = () => { onSave(activeIdx, txt); setOk(true); setTimeout(()=>setOk(false), 2000); };
      const show = session.revealAll || session.revealedAnswers?.includes(activeIdx);

      if (session.status === 'lobby') return <div className="text-center py-40 bg-white rounded-[3rem] border animate-pulse shadow-xl max-w-md mx-auto mt-20 flex flex-col items-center gap-4"><Clock className="w-12 h-12 text-indigo-200"/><p className="font-bold text-slate-400">連線成功！請等待講師開始測驗...</p></div>;

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-3xl shadow-sm border flex justify-between items-center">
            <div><p className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-1">{session.quizTitle}</p><h2 className="text-2xl font-bold text-slate-800">第 {activeIdx+1} 題</h2></div>
            {session.status.includes('active') && <div className="flex gap-4">
              {session.status==='sync_active' && <Timer endTime={session.questionEndTime} label="本題剩餘" />}
              <Timer endTime={session.totalEndTime} label="測驗總計" />
            </div>}
          </div>
          <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden">
            <div className="p-8 bg-indigo-50/50 border-b border-indigo-100"><h3 className="text-2xl font-bold leading-relaxed text-slate-800">{q.question}</h3></div>
            <div className="p-8">
              <textarea className="w-full h-64 p-6 bg-slate-50 border-2 border-slate-100 rounded-3xl outline-none text-lg shadow-inner focus:ring-4 focus:ring-indigo-500/10 focus:bg-white focus:border-indigo-200 transition-all resize-none" placeholder="在此輸入您的作答內容..." value={txt} onChange={e=>setTxt(e.target.value)} onBlur={save} disabled={session.status==='review'} />
              <div className="mt-6 flex justify-between items-center">
                <div className="flex gap-2">{session.status!=='sync_active' && <><button onClick={()=>setLIdx(p=>Math.max(0,p-1))} disabled={activeIdx===0} className="px-5 py-2 bg-slate-100 rounded-xl font-bold disabled:opacity-30 hover:bg-slate-200">上一題</button><button onClick={()=>setLIdx(p=>Math.min(session.questions.length-1,p+1))} disabled={activeIdx===session.questions.length-1} className="px-5 py-2 bg-slate-100 rounded-xl font-bold disabled:opacity-30 hover:bg-slate-200">下一題</button></>}</div>
                {session.status!=='review' && <button onClick={save} className="bg-indigo-600 text-white px-10 py-3 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all">{ok?'已自動儲存 ✓':'手動存檔'}</button>}
              </div>
            </div>
          </div>
          {session.status === 'review' && (
            <div className={`p-10 rounded-[2.5rem] border-2 transition-all duration-700 ${show?'bg-emerald-50 border-emerald-100 opacity-100 translate-y-0 shadow-lg':'bg-slate-50 border-slate-100 opacity-50 translate-y-4'}`}>
              <h4 className="font-bold mb-4 flex items-center gap-2 text-emerald-800 tracking-widest"><Eye className="w-5 h-5"/> 標準解答內容</h4>
              {show ? <p className="text-xl leading-relaxed text-emerald-900 whitespace-pre-wrap">{q.answer}</p> : <p className="italic text-slate-400">講師尚未公開本題解答...</p>}
            </div>
          )}
        </div>
      );
    }

    // --- 計時器組件 ---
    function Timer({ endTime, label }) {
      const [t, setT] = useState(0);
      useEffect(() => {
        if(!endTime) return;
        const f = () => setT(Math.max(0, Math.floor((endTime - Date.now())/1000)));
        f(); const i = setInterval(f, 1000); return () => clearInterval(i);
      }, [endTime]);
      if(!endTime) return null;
      const m = Math.floor(t/60).toString().padStart(2,'0');
      const s = (t%60).toString().padStart(2,'0');
      const isUrgent = t < 10 && t > 0;
      return (
        <div className={`px-4 py-1.5 rounded-2xl border font-mono text-center transition-all ${isUrgent ? 'bg-red-50 text-red-600 animate-pulse border-red-200 scale-105 shadow-lg' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
          <div className="text-[8px] font-black uppercase opacity-60 leading-none mb-1">{label}</div>
          <div className="text-lg font-black leading-tight tracking-tighter">{m}:{s}</div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
