<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端互動測驗平台 - 中世紀音樂史</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel (負責在瀏覽器編譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // --- 匯入 React 與 Lucide 元件 (ESM 模式) ---
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Play, Square, Clock, Users, CheckCircle, ChevronRight, 
      ChevronLeft, Eye, ListChecks, ArrowRight, UserCircle, 
      LogOut, RefreshCw, Copy, Link as LinkIcon, Send, 
      Download, Upload, AlertTriangle 
    } from 'https://esm.sh/lucide-react@0.292.0';

    // Firebase 服務匯入
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // --- 完整 20 題資料庫 ---
    const DEFAULT_QUIZ_BANKS = {
      "basic": {
        "name": "中世紀音樂史 - 初階測驗 (10題)",
        "questions": [
          { "id": 1, "question": "請問「格雷果聖歌」在音樂形式、旋律發展與歌詞語言上有哪些主要特色？", "answer": "單曲調音樂（Monophony）、級進旋律、音域狹窄莊嚴、拉丁文歌詞。" },
          { "id": 2, "question": "什麼是多利安調式（Dorian Mode）？它在譜面上最主要的特徵是什麼？", "answer": "教會調式之一，最主要特徵是結束在第一線的「Re」音上。" },
          { "id": 3, "question": "關於格雷果聖歌中歌詞與曲調的搭配關係，請簡述「音節式」、「紐姆式」與「花彩式」三者的差異。", "answer": "音節式：一字一音；紐姆式：一字數音；花彩式：一字多音。" },
          { "id": 4, "question": "在現代五線譜廣泛使用前，中世紀的紐姆譜（四線譜）是如何精確標示音高的？", "answer": "透過設定一條基準線並標示「譜號」（如 C 或 F 譜號）來約定絕對音高。" },
          { "id": 5, "question": "「奧干農」 (Organum) 是什麼？它在西方音樂史上有何重要地位？", "answer": "早期的複音音樂，在聖歌主聲部加上第二聲部。是多聲部音樂與對位法的起源。" },
          { "id": 6, "question": "何謂「單音音樂」 (Monophony)？", "answer": "指只有單一旋律線條，沒有任何和聲、對位或伴奏聲部的音樂形式。" },
          { "id": 7, "question": "中世紀活躍於法國各地的「遊吟詩人」 (Troubadours) 的音樂有何特色？", "answer": "世俗音樂、地方方言、關於騎士之愛、通常有樂器伴奏。" },
          { "id": 8, "question": "為什麼中世紀初期的教會音樂強烈排斥使用樂器？", "answer": "認為器樂聯想到異教祭典或世俗娛樂，主張「人聲」才是神創造最純潔的樂器。" },
          { "id": 9, "question": "天主教「彌撒曲」 (Mass) 中，「固定聲部」 (Ordinary) 包含哪五個主要段落？", "answer": "Kyrie, Gloria, Credo, Sanctus, Agnus Dei。" },
          { "id": 10, "question": "什麼是「經文歌」 (Motet)？它最初是如何發展出來的？", "answer": "從奧干農的花彩段落發展而來，在上方聲部填寫新歌詞而形成。" }
        ]
      },
      "advanced": {
        "name": "中世紀音樂史 - 進階測驗 (10題)",
        "questions": [
          { "id": 1, "question": "「貴多之手（Guidonian Hand）」的主要用途與運作邏輯為何？", "answer": "教導音名、唱名與轉調的工具。手上標示絕對音名，展示三組六音音階重疊關係。" },
          { "id": 2, "question": "為什麼早期唱名系統中只有「Ut、Re、Mi、Fa、Sol、La」而沒有包含「Si」？", "answer": "當時建立在六音音階基礎上，音域超過範圍只需切換音階，不需第七個音。" },
          { "id": 3, "question": "現代七聲音階中的第七個唱名「Si」大約在何時誕生？是為了什麼需求？", "answer": "約16-17世紀。因應多聲部與和聲發展，需要「導音」來增加結尾安定感。" },
          { "id": 4, "question": "「紐特丹樂派」對西方複音音樂最大的貢獻是什麼？代表人物有誰？", "answer": "發明精確測量音符長短的「節奏調式」。代表人物為 Léonin 與 Pérotin。" },
          { "id": 5, "question": "什麼是「等節奏」 (Isorhythm) 手法？", "answer": "將固定的節奏模式 (Talea) 與旋律模式 (Color) 結合並反覆的數學化結構。" },
          { "id": 6, "question": "十四世紀「新藝術」 (Ars Nova) 在節奏與記譜上有何重大突破？", "answer": "允許二拍子與三拍子享有同等地位，並發明更細微的音符時值（Minima）。" },
          { "id": 7, "question": "馬肖創作的《聖母彌撒曲》具有什麼跨時代意義？", "answer": "史上第一部由單一作曲家將彌撒五個固定聲部完整譜寫成一體的多聲部作品。" },
          { "id": 8, "question": "什麼是「定旋律」 (Cantus Firmus) 作曲手法？", "answer": "借用一段現成旋律放慢速度作為基礎聲部(Tenor)，其他聲部圍繞其發展對位。" },
          { "id": 9, "question": "「勃艮第樂派」在和聲聽覺上帶來了什麼改變？", "answer": "大量使用三度與六度音程，取代中世紀空洞的五八度，使音樂甜美飽滿。" },
          { "id": 10, "question": "「假低音」 (Fauxbourdon) 的演唱方式與特色為何？", "answer": "即興技巧。在最高聲部下方四度唱出第三聲部，聽起來像連續的六和弦進行。" }
        ]
      }
    };

    // --- Firebase 配置 (正式金鑰) ---
    const firebaseConfig = {
      apiKey: "AIzaSyC4jSIve5kj15hSptVFJ2hOdEjcQ0GsR6w",
      authDomain: "musictest-1c0fb.firebaseapp.com",
      projectId: "musictest-1c0fb",
      storageBucket: "musictest-1c0fb.firebasestorage.app",
      messagingSenderId: "416438714609",
      appId: "1:416438714609:web:806f72c2e2d40804442950",
      measurementId: "G-8NZLQDYY1N"
    };
    
    const appId = 'medieval-quiz-final-v2';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- 主程式主體 ---
    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [session, setSession] = useState(null);
      const [answers, setAnswers] = useState([]);
      const [error, setError] = useState('');
      const [toast, setToast] = useState('');

      const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 3000); };

      useEffect(() => {
        signInAnonymously(auth).catch(e => setError("Firebase 連線失敗，請檢查匿名登入是否啟用。"));
        onAuthStateChanged(auth, setUser);
      }, []);

      useEffect(() => {
        if (!user || !code) return;
        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);
        const unsubS = onSnapshot(sRef, (d) => {
          if (d.exists()) setSession(d.data());
          else if (role === 'student') { setRole(null); setCode(''); setError('測驗室已關閉。'); }
        });
        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAnswers(docs.filter(a => a.sessionId === code));
        });
        return () => { unsubS(); unsubA(); };
      }, [user, code, role]);

      const handleCreate = async () => {
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, status: 'lobby', quizBankId: 'basic', quizTitle: DEFAULT_QUIZ_BANKS['basic'].name,
            questions: DEFAULT_QUIZ_BANKS['basic'].questions, currentQuestionIndex: 0, perQuestionTime: 60,
            totalQuizTime: 15, autoAdvance: false, revealedAnswers: [], revealAll: false, createdAt: Date.now()
          });
          setCode(newCode); setRole('instructor');
        } catch (e) { setError(`建立失敗：${e.message}`); }
      };

      const handleJoin = async (c, n) => {
        if (!c || !n) return setError('請填寫完整');
        const cU = c.trim().toUpperCase();
        const safeN = n.trim().replace(/[\/\.#$\[\]]/g, '_');
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', cU));
          if (!snap.exists()) return setError('找不到代碼');
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${cU}_${user.uid}_${safeN}`), {
            sessionId: cU, studentId: `${user.uid}_${safeN}`, studentName: safeN, answers: {}, score: 0
          }, { merge: true });
          setCode(cU); setName(safeN); setRole('student');
        } catch (e) { setError('加入失敗，請檢查資料庫規則。'); }
      };

      if (error) return <div className="h-screen flex items-center justify-center p-6"><div className="bg-white p-8 rounded-2xl shadow-xl border border-red-200 text-center"><AlertTriangle className="mx-auto text-red-500 mb-4" /><p className="mb-4">{error}</p><button onClick={()=>setError('')} className="bg-indigo-600 text-white px-6 py-2 rounded-lg">重試</button></div></div>;
      if (!user) return <div className="h-screen flex items-center justify-center text-slate-400">連線中...</div>;

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <header className="bg-indigo-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
            <h1 className="font-bold flex items-center gap-2"><ListChecks /> 雲端即時測驗平台</h1>
            {role && <div className="bg-indigo-800 px-4 py-1.5 rounded-full text-xs flex items-center gap-4">
              <span>{role==='instructor'?'講師':'學生: '+name}</span><span className="font-mono text-yellow-300">代碼: {code}</span>
              <button onClick={()=>{setRole(null); setCode('');}} className="bg-red-500 hover:bg-red-600 px-3 py-0.5 rounded-full text-xs">離開</button>
            </div>}
          </header>
          <main className="flex-1 max-w-6xl mx-auto p-4 md:p-8 w-full">
            {!role && <Lobby onJoin={handleJoin} onCreate={handleCreate} />}
            {role === 'instructor' && session && <Instructor code={code} session={session} answers={answers} db={db} showToast={showToast} />}
            {role === 'student' && session && <Student session={session} myData={answers.find(a=>a.studentId===`${user.uid}_${name}`)} onSave={(i,t)=>{
               updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${code}_${user.uid}_${name}`), { [`answers.${i}`]: t });
            }} />}
          </main>
          {toast && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full flex items-center gap-2 animate-bounce z-50 shadow-2xl">{toast}</div>}
        </div>
      );
    }

    function Lobby({ onJoin, onCreate }) {
      const [c, setC] = useState(''); const [n, setN] = useState('');
      useEffect(() => { const uc = new URLSearchParams(window.location.search).get('code'); if(uc) setC(uc.toUpperCase()); }, []);
      return (
        <div className="grid md:grid-cols-2 gap-8 mt-10">
          <div className="bg-white p-8 rounded-3xl shadow-sm border">
            <h2 className="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 學生加入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="姓名" className="w-full p-4 bg-slate-50 border rounded-2xl" value={n} onChange={e=>setN(e.target.value)} />
              <input type="text" placeholder="代碼" className="w-full p-4 bg-slate-50 border rounded-2xl font-mono" value={c} onChange={e=>setC(e.target.value)} />
              <button onClick={()=>onJoin(c,n)} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">進入測驗</button>
            </div>
          </div>
          <div className="bg-gradient-to-br from-indigo-50 to-white p-8 rounded-3xl shadow-sm border flex flex-col justify-center">
            <h2 className="text-2xl font-bold mb-4 flex items-center gap-2"><Users /> 講師管理</h2>
            <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl">建立新教室</button>
          </div>
        </div>
      );
    }

    function Instructor({ code, session, answers, db, showToast }) {
      const qRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);
      const next = () => {
        if (session.currentQuestionIndex < session.questions.length - 1) {
          updateDoc(qRef, { currentQuestionIndex: session.currentQuestionIndex + 1, questionEndTime: Date.now() + session.perQuestionTime * 1000 });
        } else { updateDoc(qRef, { status: 'review', questionEndTime: null, currentQuestionIndex: 0 }); }
      };

      useEffect(() => {
        let t; if (session.status === 'sync_active' && session.autoAdvance && session.questionEndTime) {
          const d = session.questionEndTime - Date.now();
          if (d <= 0) next(); else t = setTimeout(next, d);
        } return () => clearTimeout(t);
      }, [session.status, session.currentQuestionIndex, session.questionEndTime, session.autoAdvance]);

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl shadow-sm border">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold">控制台</h2>
              <div className="flex gap-4">
                {session.status==='sync_active' && <Timer endTime={session.questionEndTime} label="當前倒數" />}
                <Timer endTime={session.totalEndTime} label="總倒數" />
              </div>
            </div>
            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-8 border-t pt-6">
                <div className="space-y-4">
                  <button onClick={()=>{navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?code=${code}`); showToast('連結已複製');}} className="bg-indigo-600 text-white w-full py-2 rounded-lg font-bold text-xs">複製學生邀請連結</button>
                  <select className="w-full p-3 border rounded-xl" value={session.quizBankId} onChange={e=>updateDoc(qRef, {quizBankId:e.target.value, quizTitle:DEFAULT_QUIZ_BANKS[e.target.value].name, questions:DEFAULT_QUIZ_BANKS[e.target.value].questions})}>
                    {Object.entries(DEFAULT_QUIZ_BANKS).map(([id,b])=><option key={id} value={id}>{b.name}</option>)}
                  </select>
                  <div className="flex gap-4">
                    <input type="number" className="w-1/2 p-2 border rounded-lg" value={session.perQuestionTime} onChange={e=>updateDoc(qRef,{perQuestionTime:Number(e.target.value)})} placeholder="每題秒數" />
                    <select className="w-1/2 p-2 border rounded-lg" value={session.autoAdvance} onChange={e=>updateDoc(qRef,{autoAdvance:e.target.value==='true'})}><option value="false">手動</option><option value="true">自動</option></select>
                  </div>
                </div>
                <div className="flex flex-col justify-center gap-3">
                  <button onClick={()=>updateDoc(qRef,{status:'sync_active',currentQuestionIndex:0,totalEndTime:Date.now()+session.totalQuizTime*60000,questionEndTime:Date.now()+session.perQuestionTime*1000})} disabled={answers.length===0} className="bg-indigo-600 text-white py-4 rounded-2xl font-bold">啟動同步測驗</button>
                  <button onClick={()=>updateDoc(qRef,{status:'async_active',totalEndTime:Date.now()+session.totalQuizTime*60000})} disabled={answers.length===0} className="bg-white border border-indigo-600 text-indigo-700 py-4 rounded-2xl font-bold">開放各自作答</button>
                </div>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl">
                <p className="font-bold">現正派發：{session.quizTitle}</p>
                <div className="flex gap-2">
                  {session.status==='sync_active' && <button onClick={next} className="bg-white text-indigo-900 px-6 py-2 rounded-xl font-bold">{session.currentQuestionIndex<session.questions.length-1?'下一題':'進入檢討'}</button>}
                  <button onClick={()=>updateDoc(qRef,{status:'review',questionEndTime:null,currentQuestionIndex:0})} className="bg-red-500 px-6 py-2 rounded-xl font-bold">結束</button>
                </div>
              </div>
            )}
          </div>
          <div className="grid lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white p-8 rounded-3xl border">
               <h3 className="text-xl font-bold mb-4 border-b pb-4">Q{session.currentQuestionIndex+1}. 題目預覽</h3>
               <p className="text-xl mb-8 leading-relaxed">{session.questions?.[session.currentQuestionIndex]?.question}</p>
               <div className="bg-green-50 p-6 rounded-2xl text-emerald-900"><h4 className="font-bold mb-2 text-xs">解答內容：</h4><p className="whitespace-pre-wrap">{session.questions?.[session.currentQuestionIndex]?.answer}</p></div>
            </div>
            <div className="bg-white p-6 rounded-3xl border h-[600px] flex flex-col">
              <h3 className="font-bold border-b pb-4 mb-4">學生列表 ({answers.length})</h3>
              <div className="flex-1 overflow-y-auto space-y-3 custom-scrollbar">
                {answers.map(s => (
                  <div key={s.id} className="p-3 bg-slate-50 rounded-xl border">
                    <div className="flex justify-between mb-2"><span className="font-bold text-indigo-900">{s.studentName}</span>{session.status==='review' && <input type="number" className="w-12 text-center border rounded" value={s.score||0} onChange={e=>updateDoc(doc(db,'artifacts',appId,'public','data','answers',s.id),{score:Number(e.target.value)})} />}</div>
                    <div className="text-xs text-slate-500 bg-white p-2 rounded italic">{s.answers[session.currentQuestionIndex]||'尚未答題'}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Student({ session, myData, onSave }) {
      const [lIdx, setLIdx] = useState(0);
      const activeIdx = session.status === 'sync_active' ? session.currentQuestionIndex : lIdx;
      const q = session.questions?.[activeIdx] || {};
      const [txt, setTxt] = useState(''); const [ok, setOk] = useState(false);
      useEffect(() => { if(myData) setTxt(myData.answers[activeIdx] || ''); }, [activeIdx, myData]);
      useEffect(() => { if(session.status==='sync_active') setLIdx(session.currentQuestionIndex); }, [session.currentQuestionIndex]);
      const save = () => { onSave(activeIdx, txt); setOk(true); setTimeout(()=>setOk(false), 2000); };
      const show = session.revealAll || session.revealedAnswers?.includes(activeIdx);
      if (session.status === 'lobby') return <div className="text-center py-40 bg-white rounded-3xl border animate-pulse shadow-xl max-w-md mx-auto mt-20">連線成功！請等待老師開始...</div>;
      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-2xl border flex justify-between items-center">
            <div><p className="text-[10px] font-bold text-indigo-500">{session.quizTitle}</p><h2 className="text-2xl font-bold">第 {activeIdx+1} 題</h2></div>
            {session.status.includes('active') && <div className="flex gap-2"><Timer endTime={session.totalEndTime} label="總計時間" /></div>}
          </div>
          <div className="bg-white rounded-3xl shadow-xl border p-8">
            <h3 className="text-2xl font-bold leading-relaxed mb-8">{q.question}</h3>
            <textarea className="w-full h-64 p-6 bg-slate-50 border rounded-2xl outline-none text-lg focus:bg-white transition-all shadow-inner" placeholder="在此輸入作答內容..." value={txt} onChange={e=>setTxt(e.target.value)} onBlur={save} disabled={session.status==='review'} />
            <div className="mt-6 flex justify-between">
              <div>{session.status!=='sync_active' && <button onClick={()=>setLIdx(p=>Math.max(0,p-1))} disabled={activeIdx===0} className="px-4 py-2 bg-slate-100 rounded">上一題</button>}</div>
              {session.status!=='review' && <button onClick={save} className="bg-indigo-600 text-white px-10 py-3 rounded-2xl font-bold shadow-lg">{ok?'已儲存 ✓':'儲存作答'}</button>}
            </div>
          </div>
          {session.status === 'review' && show && (
            <div className="p-8 rounded-3xl border-2 bg-emerald-50 border-emerald-100"><h4 className="font-bold mb-4 flex items-center gap-2 text-emerald-800"><Eye /> 標準解答內容：</h4><p className="text-xl leading-relaxed text-emerald-900">{q.answer}</p></div>
          )}
        </div>
      );
    }

    function Timer({ endTime, label }) {
      const [t, setT] = useState(0);
      useEffect(() => {
        if(!endTime) return;
        const f = () => setT(Math.max(0, Math.floor((endTime - Date.now())/1000)));
        f(); const i = setInterval(f, 1000); return () => clearInterval(i);
      }, [endTime]);
      if(!endTime) return null;
      return <div className="px-4 py-1.5 rounded-xl border bg-slate-50 text-xs font-mono text-center"><div>{label}</div><div className="text-lg font-bold">{Math.floor(t/60).toString().padStart(2,'0')}:{(t%60).toString().padStart(2,'0')}</div></div>;
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
