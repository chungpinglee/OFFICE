<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雲端互動測驗平台 - 旗艦完整版</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel (負責在瀏覽器編譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* 基礎捲軸美化 */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    /* 關鍵：按鈕滑鼠滑過特效 (紅色背景 + 放大 10% + 白色文字) */
    .btn-quiz-action {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-quiz-action:hover:not(:disabled) {
      background-color: #ef4444 !important; /* 紅色背景 */
      color: white !important; /* 白色文字 */
      transform: scale(1.1); /* 放大 10% */
      z-index: 50;
      box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }
    .btn-quiz-action:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* 針對手機版一螢幕設計 (使用 dvh 避免網址列干擾) */
    @media (max-width: 640px) {
      .mobile-full-height {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .scroll-content {
        flex: 1;
        overflow-y: auto;
      }
      .question-box {
        max-height: 25vh;
        overflow-y: auto;
      }
      .answer-area {
        flex: 1;
        min-height: 80px;
        display: flex;
        flex-direction: column;
      }
    }

    @keyframes scale-in {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scale-in {
      animation: scale-in 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Play, Square, Clock, Users, CheckCircle, ChevronRight, 
      ChevronLeft, Eye, ListChecks, ArrowRight, UserCircle, 
      LogOut, RefreshCw, Copy, Link as LinkIcon, Send, 
      Download, Upload, AlertTriangle, X, FileSearch, Edit3, Save, Lock, ClipboardList, Database, EyeOff, Calendar, LayoutList
    } from 'https://esm.sh/lucide-react@0.292.0';

    // Firebase 服務匯入
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // --- 固定 appId 確保穩定連線 ---
    const appId = 'music-quiz-stable-v1-production';

    const firebaseConfig = {
      apiKey: "AIzaSyC4jSIve5kj15hSptVFJ2hOdEjcQ0GsR6w",
      authDomain: "musictest-1c0fb.firebaseapp.com",
      projectId: "musictest-1c0fb",
      storageBucket: "musictest-1c0fb.firebasestorage.app",
      messagingSenderId: "416438714609",
      appId: "1:416438714609:web:806f72c2e2d40804442950",
      measurementId: "G-8NZLQDYY1N"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const getShareableUrl = (code) => {
      const url = new URL(window.location.href);
      url.searchParams.set('code', code);
      return url.toString();
    };

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [sessionCode, setSessionCode] = useState('');
      const [studentName, setStudentName] = useState('');
      const [sessionData, setSessionData] = useState(null);
      const [allAnswersData, setAllAnswersData] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [authError, setAuthError] = useState('');
      
      const [quizBanks, setQuizBanks] = useState(() => {
        const saved = localStorage.getItem('secure_quiz_banks_permanent');
        return saved ? JSON.parse(saved) : {};
      });

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

      useEffect(() => {
        const init = async () => {
          try { await signInAnonymously(auth); } 
          catch (e) { setAuthError("連線失敗：請檢查 Firebase 驗證設定。"); }
        };
        init();
        onAuthStateChanged(auth, setUser);
      }, []);

      useEffect(() => {
        if (!user || !sessionCode) return;
        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', sessionCode);
        const unsubS = onSnapshot(sRef, (snap) => {
          if (snap.exists()) { setSessionData(snap.data()); } 
          else if (role === 'student') { setRole(null); setSessionCode(''); setErrorMsg('測驗室已關閉或代碼失效。'); }
        });

        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAllAnswersData(docs.filter(a => a.sessionId === sessionCode));
        });
        return () => { unsubS(); unsubA(); };
      }, [user, sessionCode, role]);

      const handleCreate = async () => {
        if (Object.keys(quizBanks).length === 0) {
          setErrorMsg("【安全警告】程式碼內無預設考題。請先點擊右側「匯入 JSON 題庫檔」後，才能建立測驗室。");
          return;
        }
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        const firstBankKey = Object.keys(quizBanks)[0];
        const currentBank = quizBanks[firstBankKey];
        
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, status: 'lobby', quizBankId: firstBankKey, quizTitle: currentBank.name,
            questions: currentBank.questions, currentQuestionIndex: 0, 
            perQuestionUnit: 'seconds', perQuestionValue: 5,   // 新增：單題時效(單位與數值)
            totalQuizUnit: 'minutes', totalQuizValue: 1,       // 新增：總時效(單位與數值)
            autoAdvance: true, submissionDays: 1,
            submissionValue: 1, submissionUnit: 'days',        // 延續原本的非同步回傳設定
            revealedAnswers: [], revealAll: false, createdAt: Date.now()
          });
          setSessionCode(newCode); setRole('instructor');
        } catch (e) { setErrorMsg("建立失敗，請檢查資料庫 Rules 是否正確。"); }
      };

      const handleJoin = async (code, name) => {
        if (!code || !name) return setErrorMsg('請填寫姓名與代碼');
        const c = code.trim().toUpperCase();
        const n = name.trim().replace(/[\/\.#$\[\]]/g, '_');
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', c));
          if (!snap.exists()) return setErrorMsg('找不到該測驗代碼，請確認老師是否已啟動測驗。');
          const studentId = `${user.uid}_${n}`;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${c}_${studentId}`), {
            sessionId: c, studentId: studentId, studentName: n, answers: {}, score: 0, status: 'in_progress'
          }, { merge: true });
          setSessionCode(c); setStudentName(n); setRole('student');
        } catch (e) { setErrorMsg("加入失敗，請檢查網路連線。"); }
      };

      if (authError) return <div className="h-screen flex items-center justify-center p-6 text-red-600 font-bold text-center bg-white">{authError}</div>;
      if (!user) return <div className="h-screen flex items-center justify-center text-slate-400 font-bold animate-pulse tracking-widest uppercase">Connecting to Cloud Server...</div>;

      return (
        <div className="min-h-screen flex flex-col mobile-full-height">
          <header className="bg-indigo-900 text-white p-3 md:p-4 shadow-lg flex justify-between items-center sticky top-0 z-50 shrink-0 h-16 md:h-20">
            <h1 className="font-bold flex items-center gap-2 text-sm md:text-lg"><ListChecks /> 雲端互動測驗系統</h1>
            {role && (
              <div className="bg-indigo-800 px-3 py-1 rounded-full flex gap-3 text-xs md:text-sm items-center">
                <span className="hidden sm:inline">{role === 'instructor' ? '講師管理' : studentName}</span>
                <span className="font-mono text-yellow-300 font-bold tracking-widest">{sessionCode}</span>
                <button onClick={()=>{setRole(null); setSessionCode('');}} className="bg-red-500 hover:bg-red-600 px-2 py-0.5 rounded text-[10px] btn-quiz-action">離開</button>
              </div>
            )}
          </header>

          <main className="flex-1 max-w-6xl mx-auto p-2 md:p-8 w-full overflow-y-auto custom-scrollbar">
            {!role && <RoleSelection onJoin={handleJoin} onCreate={handleCreate} onResume={(c)=>{setSessionCode(c.toUpperCase()); setRole('instructor');}} hasBanks={Object.keys(quizBanks).length > 0} onImport={(b)=>{setQuizBanks(b); localStorage.setItem('secure_quiz_banks_permanent', JSON.stringify(b)); showToast('題庫載入成功');}} quizBanks={quizBanks} showToast={showToast} />}
            
            {role === 'instructor' && sessionData && (
              <InstructorView 
                code={sessionCode} session={sessionData} students={allAnswersData} db={db} showToast={showToast} quizBanks={quizBanks} 
                setQuizBanks={(b)=>{setQuizBanks(b); localStorage.setItem('secure_quiz_banks_permanent', JSON.stringify(b));}} 
              />
            )}
            
            {role === 'student' && sessionData && (
              <StudentDashboard 
                sessionData={sessionData} 
                myData={allAnswersData.find(a => a.studentId === `${user.uid}_${studentName}`)} 
                onAnswer={(idx, text) => {
                  updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${studentName}`), { [`answers.${idx}`]: text });
                }} 
                onFinalSubmit={async () => {
                  await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${studentName}`), { status: 'submitted', submittedAt: Date.now() });
                  showToast('答案已成功回傳教師端！');
                }}
              />
            )}
          </main>

          {errorMsg && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[100] transition-opacity"><div className="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-scale-in"><AlertTriangle className="mx-auto text-red-500 mb-4 w-10 h-10" /><p className="font-bold">{errorMsg}</p><button onClick={()=>setErrorMsg('')} className="mt-6 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold btn-quiz-action w-full">確認</button></div></div>}
          {toastMsg && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl animate-bounce z-50 flex items-center gap-2 text-sm"><CheckCircle className="text-green-400 w-4 h-4" />{toastMsg}</div>}
        </div>
      );
    }

    // --- 角色選擇畫面 ---
    function RoleSelection({ onJoin, onCreate, onResume, hasBanks, onImport, quizBanks, showToast }) {
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [resCode, setResCode] = useState('');
      const [isStudentLink, setIsStudentLink] = useState(false);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');
        if (codeFromUrl) { setCode(codeFromUrl.toUpperCase()); setIsStudentLink(true); }
      }, []);

      const importTrigger = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try { onImport(JSON.parse(ev.target.result)); } 
          catch (err) { alert('JSON 格式錯誤，無法載入。'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className={`mt-4 md:mt-10 ${isStudentLink ? 'max-w-md mx-auto' : 'grid md:grid-cols-2 gap-4 md:gap-8'}`}>
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
            <h2 className="text-xl md:text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 學生登入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="您的真實姓名" className="w-full p-3 md:p-4 bg-slate-50 border rounded-2xl focus:ring-2 outline-none transition-all" value={name} onChange={e => setName(e.target.value)} />
              <input type="text" placeholder="輸入 4 碼測驗代碼" className="w-full p-3 md:p-4 bg-slate-50 border rounded-2xl focus:ring-2 outline-none font-mono tracking-widest uppercase" value={code} onChange={e => setCode(e.target.value)} />
              <button onClick={() => onJoin(code, name)} className="w-full bg-indigo-600 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg btn-quiz-action">進入教室</button>
            </div>
          </div>

          {!isStudentLink && (
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between bg-gradient-to-br from-indigo-50/50 to-white">
              <div>
                <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Users /> 講師管理</h2>
                <div className="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 mb-4 text-center">
                  <p className="text-[10px] font-bold text-indigo-600 mb-3 uppercase tracking-tighter"><Lock className="w-3 h-3 inline"/> 安全模式：程式不含考題</p>
                  <label className="bg-white border-2 border-dashed border-indigo-200 p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-100 transition-colors group">
                     <Upload className="text-indigo-400 group-hover:scale-110 transition-transform mb-1 w-5 h-5" />
                     <span className="text-indigo-700 font-bold text-xs">{hasBanks ? '變更題庫檔案' : '按此匯入題庫 JSON'}</span>
                     <input type="file" className="hidden" accept=".json" onChange={importTrigger}/>
                  </label>
                </div>
                <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg btn-quiz-action">建立新測驗室</button>
              </div>
              <div className="mt-6 border-t pt-4">
                <div className="flex gap-2">
                  <input type="text" placeholder="恢復代碼" className="flex-1 p-2 bg-white border rounded-xl font-mono uppercase text-sm outline-none" value={resCode} onChange={e => setResCode(e.target.value)} />
                  <button onClick={() => onResume(resCode)} className="bg-indigo-100 text-indigo-700 font-bold px-4 rounded-xl btn-quiz-action text-sm">恢復</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 講師主控台元件 ---
    function InstructorView({ code, session, students, db, showToast, quizBanks, setQuizBanks }) {
      const [showFullBankPreview, setShowFullBankPreview] = useState(false);
      const [showResultsModal, setShowResultsModal] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editForm, setEditForm] = useState({ question: '', answer: '' });
      
      const totalQ = session.questions?.length || 0;
      const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);

      // --- 時間計算小幫手 ---
      const getQuestionEndTime = () => {
        if (session.perQuestionUnit === 'unlimited') return null;
        const val = session.perQuestionValue !== undefined ? session.perQuestionValue : 5;
        const multiplier = session.perQuestionUnit === 'minutes' ? 60000 : 1000;
        return Date.now() + (val * multiplier);
      };

      const getTotalEndTime = () => {
        if (session.totalQuizUnit === 'unlimited') return null;
        const val = session.totalQuizValue !== undefined ? session.totalQuizValue : 1;
        const multiplier = session.totalQuizUnit === 'hours' ? 3600000 : 60000;
        return Date.now() + (val * multiplier);
      };

      const nextQuestion = () => {
        if (session.currentQuestionIndex < totalQ - 1) {
          updateDoc(sRef, { currentQuestionIndex: session.currentQuestionIndex + 1, questionEndTime: getQuestionEndTime() });
        } else { updateDoc(sRef, { status: 'review', questionEndTime: null, currentQuestionIndex: 0 }); }
      };

      const handleForceEnd = () => updateDoc(sRef, { status: 'review', questionEndTime: null, totalEndTime: null, currentQuestionIndex: 0 });

      const handleStartSubmissionMode = () => {
        let multiplier = 24 * 60 * 60 * 1000; // 預設為天
        let unitText = '天';
        if (session.submissionUnit === 'minutes') { multiplier = 60 * 1000; unitText = '分鐘'; }
        if (session.submissionUnit === 'hours') { multiplier = 60 * 60 * 1000; unitText = '小時'; }

        updateDoc(sRef, {
          status: 'submission_mode',
          totalEndTime: Date.now() + ((session.submissionValue || 1) * multiplier)
        });
        showToast(`已啟動回傳模式，時限為 ${session.submissionValue || 1} ${unitText}`);
      };

      const saveEdit = async () => {
        const updatedQuestions = [...session.questions];
        updatedQuestions[editingIndex] = { ...updatedQuestions[editingIndex], ...editForm };
        const updatedBanks = { ...quizBanks };
        if (updatedBanks[session.quizBankId]) { updatedBanks[session.quizBankId].questions = updatedQuestions; setQuizBanks(updatedBanks); }
        await updateDoc(sRef, { questions: updatedQuestions });
        setEditingIndex(null); showToast('修改成功');
      };

      const exportJSON = (data, name) => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const anchor = document.createElement('a'); anchor.setAttribute("href", dataStr); anchor.setAttribute("download", `${name}.json`);
        anchor.click();
      };

      const importAnswers = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            for(let res of imported.data || imported.results || imported) {
               const studentId = res.studentId || `imported_${Math.random().toString(36).substr(2,5)}`;
               await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${code}_${studentId}`), { ...res, sessionId: code }, { merge: true });
            }
            showToast('已成功匯入作答資料庫');
          } catch(err) { alert('匯入失敗'); }
        };
        reader.readAsText(file);
      };

      useEffect(() => {
        let t; if (session.status === 'sync_active' && session.autoAdvance && session.questionEndTime) {
          const d = session.questionEndTime - Date.now();
          if (d <= 0) nextQuestion(); else t = setTimeout(nextQuestion, d);
        } return () => clearTimeout(t);
      }, [session.status, session.currentQuestionIndex, session.questionEndTime, session.autoAdvance]);

      return (
        <div className="space-y-6">
          {/* Modal: 作答總表 */}
          {showResultsModal && (
            <div className="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-2 backdrop-blur-md">
               <div className="bg-white w-full max-w-7xl h-full rounded-[2rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-4 md:p-8 border-b flex justify-between items-center bg-indigo-50">
                    <h2 className="text-lg md:text-2xl font-black text-indigo-900 flex items-center gap-2"><ClipboardList /> 全班作答內容資料庫</h2>
                    <div className="flex gap-2">
                       <label className="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl text-xs font-bold cursor-pointer btn-quiz-action flex items-center gap-1"><Upload className="w-3 h-3"/> 匯入 JSON<input type="file" className="hidden" accept=".json" onChange={importAnswers}/></label>
                       <button onClick={()=>exportJSON(students, `${session.quizTitle}_學生作答紀錄`)} className="bg-emerald-600 text-white px-3 md:px-5 py-2 rounded-xl font-bold btn-quiz-action flex items-center gap-2 text-xs shadow-md"><Database className="w-4 h-4"/> 匯出 JSON</button>
                       <button onClick={() => setShowResultsModal(false)} className="p-2 bg-white border rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition-colors btn-quiz-action"><X /></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-auto p-4 custom-scrollbar">
                    <table className="w-full text-left border-collapse min-w-[1000px]">
                      <thead><tr className="bg-slate-800 text-white text-[10px]"><th className="p-3 sticky left-0 bg-slate-800 z-10">學生姓名</th><th className="p-3 text-center">狀態</th><th className="p-3 text-center">分</th>{session.questions.map((_, i) => <th key={i} className="p-3 border-l border-slate-700 min-w-[150px]">Q{i+1} 回答</th>)}</tr></thead>
                      <tbody>{students.map((s, idx) => (<tr key={s.id} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b text-xs`}><td className="p-3 font-bold text-indigo-900 sticky left-0 bg-inherit shadow-md">{s.studentName}</td><td className="p-3 text-center">{s.status === 'submitted' ? '✅ 已回傳' : '📝 作答中'}</td><td className="p-3 text-center font-black">{s.score || 0}</td>{session.questions.map((_, i) => (<td key={i} className="p-3 border-l text-slate-600 max-w-xs truncate">{s.answers[i] || '-'}</td>))}</tr>))}</tbody>
                    </table>
                  </div>
                  <div className="p-4 border-t text-center"><button onClick={() => setShowResultsModal(false)} className="bg-slate-800 text-white px-10 py-3 rounded-2xl font-bold btn-quiz-action">關閉總表</button></div>
               </div>
            </div>
          )}

          {/* Modal: 題型檢視與修正 */}
          {showFullBankPreview && (
            <div className="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
               <div className="bg-white w-full max-w-5xl h-full rounded-[2.5rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-6 md:p-8 border-b flex justify-between items-center bg-slate-50">
                    <h2 className="text-xl md:text-2xl font-black text-indigo-900 flex items-center gap-2"><FileSearch /> 題型檢視與修正</h2>
                    <div className="flex gap-2">
                       <button onClick={()=>exportJSON(quizBanks, session.quizTitle)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs btn-quiz-action"><Download className="w-3 h-3 inline mr-1"/> 匯出題庫 JSON</button>
                       <button onClick={() => { setShowFullBankPreview(false); setEditingIndex(null); }} className="p-2 rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 btn-quiz-action"><X className="w-8 h-8"/></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar space-y-4 bg-slate-100/30">
                    {session.questions?.map((q, idx) => (
                      <div key={idx} className={`bg-white p-6 rounded-3xl border transition-all ${editingIndex === idx ? 'border-indigo-500 ring-4 ring-indigo-50' : 'border-slate-200'}`}>
                        <div className="flex gap-4">
                          <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black shrink-0 ${editingIndex === idx ? 'bg-indigo-600 text-white' : 'bg-indigo-100 text-indigo-700'}`}>Q{idx+1}</div>
                          <div className="flex-1">
                            {editingIndex === idx ? (
                              <div className="space-y-3"><textarea className="w-full p-2 border rounded-xl h-20 outline-none" value={editForm.question} onChange={e=>setEditForm({...editForm, question: e.target.value})}/><textarea className="w-full p-2 border rounded-xl h-20 outline-none" value={editForm.answer} onChange={e=>setEditForm({...editForm, answer: e.target.value})}/><div className="flex gap-2"><button onClick={saveEdit} className="bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-bold btn-quiz-action">儲存</button><button onClick={()=>setEditingIndex(null)} className="bg-slate-200 px-4 py-1.5 rounded-lg btn-quiz-action">取消</button></div></div>
                            ) : (
                              <div className="flex justify-between"><div><p className="text-xs font-bold text-slate-400 uppercase mb-1">題型：{q.type === 'choice' ? '選擇' : q.type === 'essay' ? '申論' : '填充'}</p><p className="text-md font-bold">{q.question}</p><p className="mt-2 text-sm text-emerald-700 bg-emerald-50 p-2 rounded-xl border">標準答案：{q.answer}</p></div><button onClick={()=> { setEditingIndex(idx); setEditForm({question:q.question, answer:q.answer}); }} className="p-2 text-slate-400 hover:text-indigo-600 btn-quiz-action rounded-lg"><Edit3 className="w-5 h-5"/></button></div>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="p-4 border-t text-center"><button onClick={() => setShowFullBankPreview(false)} className="bg-slate-800 text-white px-10 py-3 rounded-2xl font-bold btn-quiz-action">結束</button></div>
               </div>
            </div>
          )}

          <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-200">
            <div className="flex flex-wrap justify-between items-center mb-4 gap-4">
              <h2 className="text-xl font-bold text-indigo-900 tracking-tight">講師主控台</h2>
              <div className="flex gap-4">
                {session.status==='sync_active' && <TimerDisplay endTime={session.questionEndTime} label="單題倒數" />}
                <TimerDisplay endTime={session.totalEndTime} label="總倒數" />
              </div>
            </div>

            {/* 🌟 永遠固定顯示的分享連結區塊 */}
            <div className="mb-4 p-3 bg-indigo-50 rounded-2xl border border-indigo-100 flex items-center gap-2">
              <span className="text-xs font-bold text-indigo-800 whitespace-nowrap hidden sm:inline">學生邀請網址：</span>
              <input type="text" readOnly className="flex-1 bg-white text-[10px] md:text-xs p-2 rounded-lg border border-indigo-100 font-mono outline-none text-slate-500" value={getShareableUrl(code)} />
              <button onClick={() => { const ta = document.createElement("textarea"); ta.value = getShareableUrl(code); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('網址已複製'); }} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs btn-quiz-action whitespace-nowrap shadow-sm">複製連結</button>
            </div>

            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-4 border-t pt-4">
                <div className="space-y-4">
                   <div className="flex gap-2"><button onClick={() => setShowFullBankPreview(true)} className="flex-1 bg-white border-2 border-indigo-600 text-indigo-600 p-2 rounded-xl text-[10px] font-black btn-quiz-action shadow-sm">檢視/修正題庫</button><button onClick={() => setShowResultsModal(true)} className="flex-1 bg-indigo-600 text-white p-2 rounded-xl text-[10px] font-black btn-quiz-action shadow-md">作答與匯入總表</button></div>
                   
                   {/* 🌟 設定控制區 */}
                   <div className="grid grid-cols-1 md:grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border">
                      {/* 單題時效設定 */}
                      <div className="space-y-1">
                        <label className="text-[8px] font-bold text-slate-400">單題時效 (同步)</label>
                        <div className="flex gap-1">
                           <select className={`p-2 bg-white border rounded-xl text-xs outline-none ${session.perQuestionUnit === 'unlimited' ? 'w-full' : 'w-[55%]'}`} value={session.perQuestionUnit || 'seconds'} onChange={e => updateDoc(sRef, { perQuestionUnit: e.target.value })}>
                              <option value="unlimited">不設限</option>
                              <option value="seconds">幾秒</option>
                              <option value="minutes">幾分</option>
                           </select>
                           {session.perQuestionUnit !== 'unlimited' && (
                             <input type="number" className="w-[45%] p-2 bg-white border rounded-xl text-xs outline-none" value={session.perQuestionValue || 5} onChange={e => updateDoc(sRef, { perQuestionValue: Number(e.target.value) })} />
                           )}
                        </div>
                      </div>

                      {/* 總時效設定 */}
                      <div className="space-y-1">
                        <label className="text-[8px] font-bold text-slate-400">總時效 (同步)</label>
                        <div className="flex gap-1">
                           <select className={`p-2 bg-white border rounded-xl text-xs outline-none ${session.totalQuizUnit === 'unlimited' ? 'w-full' : 'w-[55%]'}`} value={session.totalQuizUnit || 'minutes'} onChange={e => updateDoc(sRef, { totalQuizUnit: e.target.value })}>
                              <option value="unlimited">不設限</option>
                              <option value="minutes">幾分</option>
                              <option value="hours">幾小時</option>
                           </select>
                           {session.totalQuizUnit !== 'unlimited' && (
                             <input type="number" className="w-[45%] p-2 bg-white border rounded-xl text-xs outline-none" value={session.totalQuizValue || 1} onChange={e => updateDoc(sRef, { totalQuizValue: Number(e.target.value) })} />
                           )}
                        </div>
                      </div>
                      
                      {/* 回傳時效設定 */}
                      <div className="space-y-1">
                        <label className="text-[8px] font-bold text-slate-400">回傳時效 (非同步)</label>
                        <div className="flex gap-1">
                           <select className="w-[55%] p-2 bg-white border rounded-xl text-xs outline-none" value={session.submissionUnit || 'days'} onChange={e => updateDoc(sRef, { submissionUnit: e.target.value })}>
                              <option value="minutes">分鐘</option>
                              <option value="hours">小時</option>
                              <option value="days">天</option>
                           </select>
                           <input type="number" className="w-[45%] p-2 bg-white border rounded-xl text-xs outline-none" value={session.submissionValue || 1} onChange={e => updateDoc(sRef, { submissionValue: Number(e.target.value) })} />
                        </div>
                      </div>
                   </div>
                </div>
                <div className="flex flex-col justify-center gap-2">
                   <button onClick={() => updateDoc(sRef, { status: 'sync_active', currentQuestionIndex: 0, totalEndTime: getTotalEndTime(), questionEndTime: getQuestionEndTime() })} disabled={students.length === 0} className="bg-indigo-600 text-white py-3 rounded-2xl font-bold btn-quiz-action text-sm">啟動 同步測驗模式</button>
                   <button onClick={handleStartSubmissionMode} disabled={students.length === 0} className="bg-emerald-600 text-white py-3 rounded-2xl font-bold btn-quiz-action text-sm">啟動 按鈕回傳模式 (回家作業)</button>
                </div>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl">
                <p className="font-bold flex items-center gap-2 text-xs"><Play className="w-4 h-4 fill-indigo-400" /> {session.quizTitle} ({session.status === 'submission_mode' ? '回傳模式' : '同步模式'})</p>
                <div className="flex gap-2">{session.status === 'sync_active' && <button onClick={nextQuestion} className="bg-white text-indigo-900 px-4 py-1.5 rounded-xl font-bold btn-quiz-action text-xs">下一題</button>}<button onClick={handleForceEnd} className="bg-red-500 text-white px-4 py-1.5 rounded-xl font-bold btn-quiz-action text-xs">收卷結束</button></div>
              </div>
            )}
          </div>
          
          {/* 下半部視圖 */}
          <div className="grid lg:grid-cols-3 gap-6 mt-6">
            <div className="lg:col-span-2 bg-white p-6 rounded-3xl border shadow-sm">
               <div className="flex justify-between items-center border-b pb-4 mb-4">
                 <h3 className="text-lg font-bold">題目預覽</h3>
                 {session.status === 'review' && (
                    <button onClick={() => { const idx = session.currentQuestionIndex; let newR = [...(session.revealedAnswers || [])]; if (newR.includes(idx)) newRevealed = newR.filter(i => i !== idx); else newR.push(idx); updateDoc(sRef, { revealedAnswers: newR }); }} className={`px-4 py-1.5 rounded-xl font-bold text-[10px] btn-quiz-action border ${session.revealedAnswers?.includes(session.currentQuestionIndex) ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100'}`}> {session.revealedAnswers?.includes(session.currentQuestionIndex) ? '隱藏本題解答' : '向全班公開解答'} </button>
                  )}
               </div>
               <p className="text-2xl font-bold text-slate-700 mb-6">{session.questions?.[session.currentQuestionIndex]?.question}</p>
               {session.questions?.[session.currentQuestionIndex]?.type === 'choice' && (
                 <div className="grid grid-cols-2 gap-2 mb-4">
                   {session.questions[session.currentQuestionIndex].options?.map((opt, i) => (
                     <div key={i} className="p-3 bg-slate-50 border rounded-xl text-sm text-slate-600">{opt}</div>
                   ))}
                 </div>
               )}
               <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-emerald-900 font-medium whitespace-pre-wrap">{session.questions?.[session.currentQuestionIndex]?.answer}</div>
               {(session.status === 'review' || session.status === 'submission_mode') && (
                  <div className="mt-6 pt-6 border-t flex flex-wrap gap-2">
                    {session.questions.map((_, i) => <button key={i} onClick={() => updateDoc(sRef, { currentQuestionIndex: i })} className={`w-10 h-10 rounded-xl font-bold text-xs transition-all btn-quiz-action ${session.currentQuestionIndex === i ? 'bg-indigo-600 text-white scale-110 shadow-lg' : 'bg-slate-100 text-slate-400'}`}>{i + 1}</button>)}
                  </div>
               )}
            </div>
            <div className="bg-white p-6 rounded-3xl border h-[400px] overflow-y-auto custom-scrollbar">
               <h3 className="text-md font-bold border-b pb-4 mb-4 flex items-center gap-2 font-black text-slate-700"><Users className="text-indigo-600" /> 在線學生 ({students.length})</h3>
               {students.map(s => (<div key={s.id} className="p-3 bg-slate-50 rounded-2xl border mb-2 flex justify-between items-center"><span className="text-sm font-bold">{s.studentName} {s.status === 'submitted' && '✅'}</span><input type="number" className="w-10 text-center font-bold border rounded bg-white outline-none" value={s.score || 0} onChange={e => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', s.id), { score: Number(e.target.value) })} /></div>))}
            </div>
          </div>
        </div>
      );
    }

    function StudentDashboard({ sessionData, myData, onAnswer, onFinalSubmit }) {
      const [localIdx, setLocalIdx] = useState(0);
      const [showOverview, setShowOverview] = useState(false);
      const activeIdx = sessionData.status === 'sync_active' ? sessionData.currentQuestionIndex : localIdx;
      const q = sessionData.questions?.[activeIdx] || {};
      const [text, setText] = useState('');
      const [saved, setSaved] = useState(false);

      useEffect(() => { if (myData) setText(myData.answers?.[activeIdx] || ''); }, [activeIdx, myData]);
      useEffect(() => { if (sessionData.status === 'sync_active') { setLocalIdx(sessionData.currentQuestionIndex); setShowOverview(false); } }, [sessionData.currentQuestionIndex, sessionData.status]);

      const handleSave = () => { onAnswer(activeIdx, text); setSaved(true); setTimeout(() => setSaved(false), 2000); };
      const isVisible = sessionData.revealAll || sessionData.revealedAnswers?.includes(activeIdx);

      if (sessionData.status === 'lobby') return <div className="flex h-[70vh] flex-col items-center justify-center bg-white rounded-3xl animate-pulse"><Clock className="w-16 h-16 text-indigo-200 mb-6" /><h2 className="text-xl font-black">已進入候考室</h2><p className="text-slate-500">等待教師啟動測驗模式...</p></div>;

      if (showOverview) {
        return (
          <div className="max-w-2xl mx-auto p-4 bg-white rounded-3xl shadow-xl animate-scale-in border border-slate-200 h-[85dvh] flex flex-col mt-4">
            <h2 className="text-xl font-bold border-b pb-4 flex items-center gap-2 text-indigo-900"><LayoutList /> 作答清單複查</h2>
            <div className="flex-1 overflow-y-auto space-y-4 my-4 pr-2 custom-scrollbar">
              {sessionData.questions.map((q, i) => (
                <div key={i} className={`p-4 rounded-2xl border transition-all ${myData.answers[i] ? 'bg-indigo-50 border-indigo-100' : 'bg-red-50 border-red-100'}`}>
                  <div className="flex justify-between items-start mb-2"><span className="font-bold text-xs">Q{i+1}. {q.question}</span><button onClick={()=>{setLocalIdx(i); setShowOverview(false);}} className="text-[10px] text-indigo-600 underline font-black btn-quiz-action px-2 py-1 rounded">修改</button></div>
                  <p className="text-xs text-slate-600 bg-white p-3 rounded-xl border truncate italic">{myData.answers[i] || <span className="text-red-500 font-bold">尚未填寫</span>}</p>
                </div>
              ))}
            </div>
            <div className="flex gap-4"><button onClick={()=>setShowOverview(false)} className="flex-1 p-4 bg-slate-100 rounded-2xl font-bold btn-quiz-action text-sm">返回題目</button><button onClick={()=>{if(confirm('正式回傳後將無法再次修改，確定回傳嗎？')){onFinalSubmit(); setShowOverview(false);}}} className="flex-1 p-4 bg-indigo-600 text-white rounded-2xl font-bold btn-quiz-action shadow-lg text-sm">正式回傳老師</button></div>
          </div>
        );
      }

      const isSubmitted = myData?.status === 'submitted';

      return (
        <div className="mobile-full-height max-w-2xl mx-auto px-2">
          {sessionData.status === 'review' && <div className="bg-red-600 text-white p-3 rounded-2xl text-center font-black text-sm quiz-ended-banner mb-2 shadow-lg border-2 border-red-400">作答時間已到，結束測驗！</div>}
          {isSubmitted && <div className="bg-emerald-600 text-white p-3 rounded-2xl text-center font-black text-sm mb-2 shadow-lg border-2 border-green-400 animate-scale-in">答案已成功回傳！等待老師講解。</div>}

          <div className="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center mb-2 shrink-0">
             <div className="flex flex-col"><span className="text-[8px] font-bold text-indigo-500 uppercase tracking-tighter truncate w-32">{sessionData.quizTitle}</span><h2 className="text-sm font-bold text-slate-800">第 {activeIdx + 1} 題 / {sessionData.questions.length}</h2></div>
             <div className="flex gap-2 scale-90 origin-right"><TimerDisplay endTime={sessionData.totalEndTime} label="時效" alertMode={true}/></div>
          </div>

          <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col flex-1 min-h-0 overflow-hidden">
            <div className="p-4 bg-indigo-50/50 border-b question-box-limit shrink-0"><div className="text-md md:text-xl font-bold text-slate-800 leading-tight">{(isRevealed || sessionData.status !== 'review') ? q.question : '題目已鎖定，聽取講解中...'}</div></div>
            <div className="p-4 flex flex-col flex-1 min-h-0">
              <div className="answer-area-flex">
                {q.type === 'choice' ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4 overflow-y-auto custom-scrollbar">
                    {q.options?.map((opt, i) => (
                      <button key={i} disabled={sessionData.status==='review' || isSubmitted} onClick={()=>{onAnswer(activeIdx, (i+1).toString()); setSaved(true); setTimeout(()=>setSaved(false), 1000);}} className={`p-4 rounded-2xl border-2 font-bold transition-all text-left text-sm ${text === (i+1).toString() ? 'bg-indigo-600 text-white border-indigo-800 scale-105 shadow-md' : 'bg-white border-slate-100 hover:border-indigo-300'} btn-quiz-action`}>
                        {opt}
                      </button>
                    ))}
                  </div>
                ) : (
                  <textarea className={`w-full p-4 border-2 rounded-2xl outline-none text-md leading-snug flex-1 mb-4 ${sessionData.status === 'review' || isSubmitted ? 'bg-slate-100 text-slate-400' : 'bg-white shadow-inner focus:border-indigo-400 transition-all'}`} placeholder={isSubmitted ? "已成功回傳" : "請輸入作答內容..."} value={text} onChange={e => setText(e.target.value)} onBlur={()=>onAnswer(activeIdx, text)} disabled={sessionData.status === 'review' || isSubmitted} />
                )}
              </div>
              
              <div className="flex justify-between items-center shrink-0">
                <div className="flex gap-2">{(sessionData.status !== 'sync_active') && <><button onClick={() => setLocalIdx(p => Math.max(0, p - 1))} disabled={activeIdx === 0} className="w-10 h-10 bg-slate-100 rounded-xl font-bold btn-quiz-action flex items-center justify-center"><ChevronLeft className="w-5 h-5"/></button><button onClick={() => setLocalIdx(p => Math.min(sessionData.questions.length - 1, p + 1))} disabled={activeIdx === sessionData.questions.length - 1} className="w-10 h-10 bg-slate-100 rounded-xl font-bold btn-quiz-action flex items-center justify-center"><ChevronRight className="w-5 h-5"/></button></>}</div>
                <div className="flex gap-2">
                  {sessionData.status === 'submission_mode' && !isSubmitted && <button onClick={()=>setShowOverview(true)} className="bg-slate-800 text-white px-5 py-3 rounded-2xl font-bold btn-quiz-action text-sm shadow-md flex items-center gap-1"><LayoutList className="w-4 h-4"/> 檢查回傳</button>}
                  {sessionData.status.includes('active') && !isSubmitted && (q.type === 'essay' || q.type === 'fill') && <button onClick={()=>{onAnswer(activeIdx, text); setSaved(true); setTimeout(()=>setSaved(false), 2000);}} className="bg-indigo-600 text-white px-5 py-3 rounded-2xl font-bold btn-quiz-action text-sm shadow-lg">{saved ? '已存' : '儲存'}</button>}
                </div>
              </div>
            </div>
          </div>
          
          {isRevealed && (
            <div className={`mt-3 p-4 rounded-2xl border-2 transition-all duration-700 shadow-xl bg-emerald-50 border-emerald-100 animate-scale-in shrink-0`}>
              <h4 className="font-bold mb-1 flex items-center gap-1 text-emerald-800 text-xs"><Eye className="w-4 h-4" /> 標準解答分析</h4>
              <p className="text-sm leading-snug text-emerald-900 whitespace-pre-wrap font-medium">{q.answer}</p>
            </div>
          )}
        </div>
      );
    }

    function TimerDisplay({ endTime, label, alertMode = false }) {
      const [t, setT] = useState(0);
      useEffect(() => { 
        if(!endTime) { setT(0); return; } 
        const tick = () => setT(Math.max(0, Math.floor((endTime - Date.now()) / 1000))); 
        tick(); 
        const i = setInterval(tick, 1000); 
        return () => clearInterval(i); 
      }, [endTime]);
      
      if(!endTime) return (
        <div className={`px-2 py-1 rounded-xl border font-mono text-center shadow-inner bg-slate-50 text-slate-600 border-slate-200`}>
          <div className="text-[6px] font-bold uppercase opacity-60 leading-none tracking-tighter">{label}</div>
          <div className="text-xs font-bold leading-tight tracking-tighter">不設限</div>
        </div>
      );

      const d = Math.floor(t / (24 * 3600)); 
      const h = Math.floor((t % (24 * 3600)) / 3600);
      const m = Math.floor((t % 3600) / 60).toString().padStart(2, '0');
      const s = (t % 60).toString().padStart(2, '0');
      return ( 
        <div className={`px-2 py-1 rounded-xl border font-mono text-center shadow-inner ${t < 600 && t > 0 && alertMode ? 'bg-red-50 text-red-600 animate-pulse border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
          <div className="text-[6px] font-bold uppercase opacity-60 leading-none tracking-tighter">{label}</div>
          <div className="text-xs font-bold leading-tight tracking-tighter">{d > 0 ? `${d}天 ` : ''}{h > 0 ? `${h}:` : ''}{m}:{s}</div>
        </div> 
      );
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
