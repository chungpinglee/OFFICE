<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雲端互動測驗平台 - 旗艦完整版</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel (負責在瀏覽器編譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* 基礎捲軸美化 */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    /* 按鈕滑鼠滑過特效 */
    .btn-quiz-action {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-quiz-action:hover:not(:disabled) {
      background-color: #ef4444 !important; 
      color: white !important; 
      transform: scale(1.05); 
      z-index: 50;
      box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }
    .btn-quiz-action:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* 🚀 選擇題與題目區專用滑過效果 */
    .choice-option-btn {
      transition: all 0.2s ease;
    }
    .choice-option-btn:hover:not(:disabled) {
      background-color: #16a34a !important; /* green-600 */
      color: white !important;
      border-color: #15803d !important;
    }

    /* 題目區塊滑過變綠 */
    .question-header-hover:hover {
      background-color: #16a34a !important;
      color: white !important;
    }
    .question-header-hover:hover .question-text {
      color: white !important;
    }

    @media (max-width: 640px) {
      .mobile-full-height {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .question-box-limit {
        max-height: 35vh;
        overflow-y: auto;
      }
    }

    @keyframes scale-in {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scale-in {
      animation: scale-in 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Play, Square, Clock, Users, CheckCircle, ChevronRight, 
      ChevronLeft, Eye, ListChecks, ArrowRight, UserCircle, 
      LogOut, RefreshCw, Copy, Link as LinkIcon, Send, 
      Download, Upload, AlertTriangle, X, FileSearch, Edit3, Save, Lock, ClipboardList, Database, EyeOff, Calendar, LayoutList, BarChart3, PieChart, TrendingUp, Award, Table2, BookOpen
    } from 'https://esm.sh/lucide-react@0.292.0';

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const appId = 'music-quiz-stable-v1-production';

    const firebaseConfig = {
      apiKey: "AIzaSyC4jSIve5kj15hSptVFJ2hOdEjcQ0GsR6w",
      authDomain: "musictest-1c0fb.firebaseapp.com",
      projectId: "musictest-1c0fb",
      storageBucket: "musictest-1c0fb.firebasestorage.app",
      messagingSenderId: "416438714609",
      appId: "1:416438714609:web:806f72c2e2d40804442950",
      measurementId: "G-8NZLQDYY1N"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const getShareableUrl = (code) => {
      const url = new URL(window.location.href);
      url.searchParams.set('code', code);
      return url.toString();
    };

    const copyToClipboard = (text) => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      return true;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [sessionCode, setSessionCode] = useState('');
      const [studentName, setStudentName] = useState('');
      const [sessionData, setSessionData] = useState(null);
      const [allAnswersData, setAllAnswersData] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [view, setView] = useState('main'); // 'main', 'analysis'
      
      const [quizBanks, setQuizBanks] = useState(() => {
        const saved = localStorage.getItem('secure_quiz_banks_permanent');
        return saved ? JSON.parse(saved) : {};
      });

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      useEffect(() => {
        signInAnonymously(auth).catch(() => setErrorMsg("連線失敗：請檢查網路。"));
        onAuthStateChanged(auth, setUser);
      }, []);

      useEffect(() => {
        if (!user || !sessionCode) return;
        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', sessionCode);
        const unsubS = onSnapshot(sRef, (snap) => {
          if (snap.exists()) { setSessionData(snap.data()); } 
          else if (role === 'student') { setRole(null); setSessionCode(''); setErrorMsg('測驗室已關閉或代碼失效。'); }
        });

        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAllAnswersData(docs.filter(a => a.sessionId === sessionCode));
        });
        return () => { unsubS(); unsubA(); };
      }, [user, sessionCode, role]);

      const handleCreate = async () => {
        if (Object.keys(quizBanks).length === 0) {
          setErrorMsg("請先匯入題庫 JSON 後再建立測驗室。");
          return;
        }
        const firstBankKey = Object.keys(quizBanks)[0];
        const currentBank = quizBanks[firstBankKey];
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, status: 'lobby', quizBankId: firstBankKey, quizTitle: currentBank.name || "未命名測驗",
            questions: currentBank.questions, currentQuestionIndex: 0, 
            perQuestionUnit: 'seconds', perQuestionValue: 5,
            totalQuizUnit: 'minutes', totalQuizValue: 5,
            submissionUnit: 'days', submissionValue: 1,
            revealedAnswers: [], createdAt: Date.now()
          });
          setSessionCode(newCode); setRole('instructor');
        } catch (e) { setErrorMsg("建立失敗。"); }
      };

      const handleJoin = async (code, name) => {
        if (!code || !name) return setErrorMsg('請填寫姓名與代碼');
        const c = code.trim().toUpperCase();
        const n = name.trim();
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', c));
          if (!snap.exists()) return setErrorMsg('找不到該代碼。');
          const studentId = `${user.uid}_${n}`;
          const answerRef = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${c}_${studentId}`);
          const answerSnap = await getDoc(answerRef);
          if (!answerSnap.exists()) {
            await setDoc(answerRef, { sessionId: c, studentId: studentId, studentName: n, answers: {}, status: 'in_progress', joinedAt: Date.now() });
          }
          setSessionCode(c); setStudentName(n); setRole('student');
        } catch (e) { setErrorMsg("加入失敗。"); }
      };

      if (!user) return <div className="h-screen flex items-center justify-center text-slate-400 font-bold animate-pulse uppercase tracking-widest">Connecting to Cloud Server...</div>;

      return (
        <div className="min-h-screen flex flex-col mobile-full-height">
          <header className="bg-indigo-900 text-white p-3 md:p-4 shadow-lg flex justify-between items-center shrink-0 h-16 md:h-20">
            <h1 className="font-bold flex items-center gap-2 text-sm md:text-lg"><ListChecks /> 雲端互動測驗系統</h1>
            {role && (
              <div className="bg-indigo-800 px-3 py-1 rounded-full flex gap-3 text-xs md:text-sm items-center">
                <span>{role === 'instructor' ? '講師管理' : studentName}</span>
                <span className="font-mono text-yellow-300 font-bold tracking-widest">{sessionCode}</span>
                <button onClick={()=>{setRole(null); setSessionCode(''); setView('main');}} className="bg-red-500 hover:bg-red-600 px-2 py-0.5 rounded text-[10px] btn-quiz-action">離開</button>
              </div>
            )}
          </header>

          <main className="flex-1 max-w-7xl mx-auto p-2 md:p-8 w-full overflow-y-auto custom-scrollbar">
            {view === 'analysis' ? (
              <AnalysisDashboard onBack={() => setView('main')} currentStudents={allAnswersData} showToast={showToast} session={sessionData} />
            ) : (
              <>
                {!role && <RoleSelection onJoin={handleJoin} onCreate={handleCreate} onResume={(c)=>{setSessionCode(c.toUpperCase()); setRole('instructor');}} hasBanks={Object.keys(quizBanks).length > 0} onImport={(b)=>{setQuizBanks(b); localStorage.setItem('secure_quiz_banks_permanent', JSON.stringify(b)); showToast('題庫載入成功');}} />}
                
                {role === 'instructor' && sessionData && (
                  <InstructorView code={sessionCode} session={sessionData} students={allAnswersData} db={db} showToast={showToast} quizBanks={quizBanks} setQuizBanks={(b)=>{setQuizBanks(b); localStorage.setItem('secure_quiz_banks_permanent', JSON.stringify(b));}} onGoAnalysis={() => setView('analysis')} />
                )}
                
                {role === 'student' && sessionData && (
                  <StudentDashboard 
                    sessionData={sessionData} 
                    myData={allAnswersData.find(a => a.studentId === `${user.uid}_${studentName}`)} 
                    onAnswer={(idx, text) => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${studentName}`);
                      updateDoc(ref, { [`answers.${idx}`]: text });
                    }} 
                    onFinalSubmit={async () => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${studentName}`);
                      await updateDoc(ref, { status: 'submitted', submittedAt: Date.now() });
                      showToast('答案已成功回傳！');
                    }}
                    showToast={showToast}
                  />
                )}
              </>
            )}
          </main>

          {errorMsg && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[100]"><div className="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-scale-in"><AlertTriangle className="mx-auto text-red-500 mb-4 w-10 h-10" /><p className="font-bold">{errorMsg}</p><button onClick={()=>setErrorMsg('')} className="mt-6 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold btn-quiz-action w-full">確認</button></div></div>}
          {toastMsg && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl animate-bounce z-50 flex items-center gap-2 text-sm"><CheckCircle className="text-green-400 w-4 h-4" />{toastMsg}</div>}
        </div>
      );
    }

    function RoleSelection({ onJoin, onCreate, onResume, hasBanks, onImport }) {
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [resCode, setResCode] = useState('');
      const [isStudentLink, setIsStudentLink] = useState(false);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');
        if (codeFromUrl) {
          setCode(codeFromUrl.toUpperCase());
          setIsStudentLink(true);
        }
      }, []);

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            let normalized = {};
            if (Array.isArray(data)) { normalized = { "custom": { name: file.name.replace('.json',''), questions: data } }; } 
            else if (data.questions && Array.isArray(data.questions)) { normalized = { "custom": data }; } 
            else { normalized = data; }
            onImport(normalized);
          } catch(err) { alert('JSON 格式錯誤'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className={`mt-4 md:mt-10 ${isStudentLink ? 'flex justify-center' : 'grid md:grid-cols-2 gap-4 md:gap-8'}`}>
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 w-full max-w-md animate-scale-in">
            <h2 className="text-xl md:text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 學生登入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="您的真實姓名" className="w-full p-3 md:p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2" value={name} onChange={e => setName(e.target.value)} />
              <input type="text" placeholder="輸入 4 碼測驗代碼" className="w-full p-3 md:p-4 bg-slate-50 border rounded-2xl font-mono tracking-widest uppercase outline-none focus:ring-2" value={code} onChange={e => setCode(e.target.value)} />
              <button onClick={() => onJoin(code, name)} className="w-full bg-indigo-600 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg btn-quiz-action">進入教室</button>
            </div>
          </div>
          {!isStudentLink && (
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between bg-gradient-to-br from-indigo-50/50 to-white animate-scale-in">
              <div>
                <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Users /> 講師管理</h2>
                <div className="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 mb-4 text-center">
                  <label className="bg-white border-2 border-dashed border-indigo-200 p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-100 transition-colors">
                     <Upload className="text-indigo-400 mb-1 w-5 h-5" />
                     <span className="text-indigo-700 font-bold text-xs">{hasBanks ? '變更題庫檔案' : '按此匯入題庫 JSON'}</span>
                     <input type="file" className="hidden" accept=".json" onChange={handleImportFile}/>
                  </label>
                </div>
                <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg btn-quiz-action">建立新測驗室</button>
              </div>
              <div className="mt-6 border-t pt-4">
                <div className="flex gap-2">
                  <input type="text" placeholder="恢復代碼" className="flex-1 p-2 border rounded-xl font-mono uppercase text-sm outline-none" value={resCode} onChange={e => setResCode(e.target.value)} />
                  <button onClick={() => onResume(resCode)} className="bg-indigo-100 text-indigo-700 font-bold px-4 rounded-xl btn-quiz-action text-sm">恢復</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function InstructorView({ code, session, students, db, showToast, quizBanks, setQuizBanks, onGoAnalysis }) {
      const [showFullBankPreview, setShowFullBankPreview] = useState(false);
      const [showResultsModal, setShowResultsModal] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editForm, setEditForm] = useState({ question: '', answer: '', options: [] });
      
      const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);

      const saveEdit = async () => {
        const updatedQuestions = [...session.questions];
        updatedQuestions[editingIndex] = { ...updatedQuestions[editingIndex], ...editForm };
        const updatedBanks = { ...quizBanks };
        if (updatedBanks[session.quizBankId]) { updatedBanks[session.quizBankId].questions = updatedQuestions; setQuizBanks(updatedBanks); }
        await updateDoc(sRef, { questions: updatedQuestions });
        setEditingIndex(null); showToast('修改成功！');
      };

      const exportJSON = (data, name) => {
        const jsonStr = JSON.stringify(data, null, 2);
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr);
        const anchor = document.createElement('a'); 
        anchor.setAttribute("href", dataStr); 
        anchor.setAttribute("download", `${name}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        showToast('已匯出');
      };

      return (
        <div className="space-y-6 animate-scale-in">
          {showFullBankPreview && (
            <div className="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
               <div className="bg-white w-full max-w-5xl h-full rounded-[2.5rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-6 md:p-8 border-b flex flex-wrap justify-between items-center bg-slate-50 gap-4">
                    <h2 className="text-xl md:text-2xl font-black text-indigo-900 flex items-center gap-2"><FileSearch /> 題型檢視與修正</h2>
                    <div className="flex items-center gap-2">
                       <button onClick={() => exportJSON(session.questions, `${session.quizTitle}_更新題庫`)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold btn-quiz-action text-xs flex items-center gap-2 shadow-md"><Download className="w-4 h-4"/> 匯出更新後題庫 JSON</button>
                       <button onClick={() => { setShowFullBankPreview(false); setEditingIndex(null); }} className="p-2 rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 btn-quiz-action"><X className="w-8 h-8"/></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar space-y-4 bg-slate-100/30">
                    {session.questions?.map((q, idx) => (
                      <div key={idx} className={`bg-white p-6 rounded-3xl border transition-all ${editingIndex === idx ? 'border-indigo-500 ring-4 ring-indigo-50' : 'border-slate-200'}`}>
                        <div className="flex gap-4">
                          <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black shrink-0 ${editingIndex === idx ? 'bg-indigo-600 text-white' : 'bg-indigo-100 text-indigo-700'}`}>Q{idx+1}</div>
                          <div className="flex-1">
                            {editingIndex === idx ? (
                              <div className="space-y-4">
                                <textarea className="w-full p-3 border rounded-xl h-20 outline-none" value={editForm.question} onChange={e=>setEditForm({...editForm, question: e.target.value})}/>
                                {q.type === 'choice' && (
                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    {[0,1,2,3].map(i => (
                                      <input key={i} type="text" className="p-2 border rounded-lg text-sm" value={editForm.options[i] || ''} onChange={e=>{
                                        const newOpts = [...editForm.options]; newOpts[i] = e.target.value; setEditForm({...editForm, options: newOpts});
                                      }} placeholder={`選項 ${i+1}`} />
                                    ))}
                                  </div>
                                )}
                                <input type="text" className="w-full p-3 border rounded-xl text-emerald-700 font-bold" value={editForm.answer} onChange={e=>setEditForm({...editForm, answer: e.target.value})} placeholder="標準答案編號或內容" />
                                <div className="flex gap-2"><button onClick={saveEdit} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold btn-quiz-action">儲存修改</button><button onClick={()=>setEditingIndex(null)} className="bg-slate-200 px-6 py-2 rounded-xl btn-quiz-action">取消</button></div>
                              </div>
                            ) : (
                              <div className="flex justify-between items-start">
                                <div><p className="text-md font-bold">{q.question}</p>{q.type === 'choice' && <div className="grid grid-cols-2 gap-2 mt-2">{q.options?.map((opt, i) => <div key={i} className="text-xs text-slate-500 bg-slate-50 p-2 rounded-lg border">{i+1}. {opt}</div>)}</div>}<div className="mt-3 text-sm text-emerald-700 bg-emerald-50 p-3 rounded-xl border border-emerald-100 whitespace-pre-wrap">標準解答：{q.answer}</div></div>
                                <button onClick={()=> { setEditingIndex(idx); setEditForm({question:q.question, answer:q.answer, options: q.options || []}); }} className="p-2 text-slate-400 hover:text-indigo-600 btn-quiz-action bg-slate-50 rounded-xl border"><Edit3 className="w-5 h-5"/></button>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="p-6 border-t text-center"><button onClick={() => setShowFullBankPreview(false)} className="bg-slate-800 text-white px-12 py-3 rounded-2xl font-bold btn-quiz-action">結束預覽</button></div>
               </div>
            </div>
          )}

          {/* Modal: 作答總表 */}
          {showResultsModal && (
            <div className="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-2 backdrop-blur-md">
               <div className="bg-white w-full max-w-7xl h-full rounded-[2rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-6 border-b flex justify-between items-center bg-indigo-50">
                    <h2 className="text-xl font-black text-indigo-900 flex items-center gap-2"><ClipboardList /> 全體作答紀錄匯總</h2>
                    <div className="flex gap-2">
                       <button onClick={()=>exportJSON(students, `${session.quizTitle}_學生作答`)} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold btn-quiz-action text-xs"><Database className="w-4 h-4 inline mr-1"/> 匯出 JSON</button>
                       <button onClick={() => setShowResultsModal(false)} className="p-2 border rounded-full btn-quiz-action"><X /></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-auto p-4 custom-scrollbar">
                    <table className="w-full text-left border-collapse min-w-[1000px]">
                      <thead><tr className="bg-slate-800 text-white text-[10px]"><th className="p-3 sticky left-0 bg-slate-800">學生</th><th className="p-3 text-center">狀態</th><th className="p-3 text-center">得分</th>{session.questions.map((_, i) => <th key={i} className="p-3 border-l border-slate-700">Q{i+1}</th>)}</tr></thead>
                      <tbody>{students.map((s, idx) => (<tr key={idx} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b text-xs`}><td className="p-3 font-bold sticky left-0 bg-inherit shadow-md text-indigo-800">{s.studentName}</td><td className="p-3 text-center">{s.status === 'submitted' ? '✅ 已送出' : '📝 作答中'}</td><td className="p-3 font-black text-center">{s.score || 0}</td>{session.questions.map((_, i) => (<td key={i} className="p-3 border-l text-slate-600 truncate max-w-[200px]">{s.answers?.[i] || '-'}</td>))}</tr>))}</tbody>
                    </table>
                  </div>
               </div>
            </div>
          )}

          <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-200">
            <div className="flex flex-wrap justify-between items-center mb-4 gap-4">
              <h2 className="text-xl font-bold text-indigo-900 tracking-tight">講師主控台</h2>
              <div className="flex gap-4">
                <TimerDisplay endTime={session.questionEndTime} label="單題倒數" />
                <TimerDisplay endTime={session.totalEndTime} label="總倒數" />
              </div>
            </div>

            <div className="p-3 bg-indigo-50 rounded-xl border border-indigo-100 flex items-center gap-2 mb-6">
              <span className="text-xs font-bold text-indigo-800 whitespace-nowrap">學生測驗網址：</span>
              <input type="text" readOnly className="flex-1 bg-white text-xs p-2 rounded border font-mono text-slate-400 outline-none tracking-widest" value="******** (點擊右側按鈕複製)" />
              <button onClick={() => { copyToClipboard(getShareableUrl(code)); showToast('已複製連結!'); }} className="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold btn-quiz-action whitespace-nowrap">複製連結</button>
            </div>

            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-6 border-t pt-4">
                 <div className="space-y-4">
                    <div className="flex gap-2">
                       <button onClick={() => setShowFullBankPreview(true)} className="flex-1 bg-white border-2 border-indigo-600 text-indigo-600 p-2 rounded-xl text-xs font-black btn-quiz-action shadow-sm flex items-center justify-center gap-1"><Edit3 className="w-3 h-3"/> 檢視題庫</button>
                       <button onClick={onGoAnalysis} className="flex-1 bg-indigo-100 border-2 border-indigo-300 text-indigo-700 p-2 rounded-xl text-xs font-black btn-quiz-action shadow-sm flex items-center justify-center gap-1"><BarChart3 className="w-3 h-3"/> 進入作答分析</button>
                    </div>
                    <div className="grid grid-cols-1 gap-3 bg-slate-50 p-4 rounded-2xl border">
                      <div className="flex flex-col gap-1">
                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">1. 同步：單題限時</label>
                        <div className="flex gap-2 items-center">
                           <select className="flex-1 p-2 bg-white border rounded-xl text-xs" value={session.perQuestionUnit || 'seconds'} onChange={e => updateDoc(sRef, { perQuestionUnit: e.target.value })}>
                              <option value="unlimited">不設限</option>
                              <option value="seconds">秒</option>
                              <option value="minutes">分</option>
                           </select>
                           {session.perQuestionUnit !== 'unlimited' && (
                             <div className="flex items-center gap-1 bg-white border rounded-xl px-2 shadow-inner">
                               <input type="number" className="w-12 p-2 outline-none text-xs" value={session.perQuestionValue || 5} onChange={e => updateDoc(sRef, { perQuestionValue: Number(e.target.value) })} />
                               <span className="text-xs font-bold text-indigo-500">{session.perQuestionUnit === 'seconds' ? '秒' : '分'}</span>
                             </div>
                           )}
                        </div>
                      </div>
                      <div className="flex flex-col gap-1">
                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">2. 同步：測驗總時長</label>
                        <div className="flex gap-2 items-center">
                           <select className="flex-1 p-2 bg-white border rounded-xl text-xs" value={session.totalQuizUnit || 'minutes'} onChange={e => updateDoc(sRef, { totalQuizUnit: e.target.value })}>
                              <option value="unlimited">不設限</option>
                              <option value="minutes">分</option>
                              <option value="hours">時</option>
                           </select>
                           {session.totalQuizUnit !== 'unlimited' && (
                             <div className="flex items-center gap-1 bg-white border rounded-xl px-2 shadow-inner">
                               <input type="number" className="w-12 p-2 outline-none text-xs" value={session.totalQuizValue || 5} onChange={e => updateDoc(sRef, { totalQuizValue: Number(e.target.value) })} />
                               <span className="text-xs font-bold text-indigo-500">{session.totalQuizUnit === 'minutes' ? '分' : '時'}</span>
                             </div>
                           )}
                        </div>
                      </div>
                      <div className="flex flex-col gap-1">
                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">3. 非同步：回傳時效</label>
                        <div className="flex gap-2 items-center">
                           <select className="flex-1 p-2 bg-white border rounded-xl text-xs" value={session.submissionUnit || 'days'} onChange={e => updateDoc(sRef, { submissionUnit: e.target.value })}>
                              <option value="minutes">分</option>
                              <option value="hours">時</option>
                              <option value="days">天</option>
                           </select>
                           <div className="flex items-center gap-1 bg-white border rounded-xl px-2 shadow-inner">
                             <input type="number" className="w-12 p-2 outline-none text-xs" value={session.submissionValue || 1} onChange={e => updateDoc(sRef, { submissionValue: Number(e.target.value) })} />
                             <span className="text-xs font-bold text-indigo-500">{session.submissionUnit === 'minutes' ? '分' : session.submissionUnit === 'hours' ? '時' : '天'}</span>
                           </div>
                        </div>
                      </div>
                    </div>
                 </div>
                 <div className="flex flex-col justify-center gap-3">
                    <button onClick={() => updateDoc(sRef, { status: 'sync_active', currentQuestionIndex: 0, totalEndTime: Date.now() + (session.totalQuizValue * 60000), questionEndTime: Date.now() + (session.perQuestionValue * 1000) })} className="bg-indigo-600 text-white py-4 rounded-2xl font-bold btn-quiz-action text-sm shadow-lg">啟動：同步競賽模式</button>
                    <button onClick={() => updateDoc(sRef, { status: 'submission_mode', totalEndTime: null })} className="bg-emerald-600 text-white py-4 rounded-2xl font-bold btn-quiz-action text-sm shadow-lg">啟動：非同步作業模式</button>
                    <button onClick={() => setShowResultsModal(true)} className="bg-slate-100 text-slate-700 py-3 rounded-2xl font-bold btn-quiz-action text-xs">觀看學生回傳答案表</button>
                 </div>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl animate-scale-in">
                 <div className="flex flex-col"><span className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">{session.status === 'submission_mode' ? '回傳模式' : '測驗進行中'}</span><p className="font-bold text-sm">{session.quizTitle}</p></div>
                 <div className="flex gap-3">
                   <button onClick={onGoAnalysis} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold btn-quiz-action text-xs flex items-center gap-1"><BarChart3 className="w-3 h-3"/> 作答分析</button>
                   <button onClick={() => setShowResultsModal(true)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold btn-quiz-action text-xs">學生總表</button>
                   <button onClick={() => updateDoc(sRef, { status: 'review', totalEndTime: null, questionEndTime: null })} className="bg-red-500 text-white px-6 py-2 rounded-xl font-bold btn-quiz-action text-xs">結束並收卷</button>
                 </div>
              </div>
            )}
          </div>
          
          <div className="grid lg:grid-cols-3 gap-6 mt-6">
            <div className="lg:col-span-2 bg-white p-6 rounded-3xl border shadow-sm h-fit">
               <div className="flex justify-between items-center border-b pb-4 mb-4"><h3 className="text-lg font-bold">當前題目: Q{session.currentQuestionIndex+1}</h3></div>
               <p className="text-2xl font-bold text-slate-700 mb-6 leading-relaxed">{session.questions?.[session.currentQuestionIndex]?.question}</p>
               <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-emerald-900 font-medium whitespace-pre-wrap">標準解答：{session.questions?.[session.currentQuestionIndex]?.answer}</div>
            </div>
            <div className="bg-white p-6 rounded-3xl border h-[400px] overflow-y-auto custom-scrollbar">
               <h3 className="text-md font-bold border-b pb-4 mb-4 flex items-center gap-2 font-black text-slate-700"><Users className="text-indigo-600" /> 在線學生 ({students.length})</h3>
               {students.map(s => (<div key={s.id} className="p-3 bg-slate-50 rounded-2xl border mb-2 flex justify-between items-center animate-scale-in"><span className="text-sm font-bold">{s.studentName} {s.status === 'submitted' && '✅'}</span><input type="number" className="w-12 text-center border rounded font-bold" value={s.score || 0} onChange={e => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'answers', s.id), { score: Number(e.target.value) })} /></div>))}
            </div>
          </div>
        </div>
      );
    }

    function AnalysisDashboard({ onBack, currentStudents, showToast, session }) {
      const [importedData, setImportedData] = useState(null);
      const data = importedData || currentStudents;
      const questions = session?.questions || [];

      const stats = useMemo(() => {
        if (!data || data.length === 0) return { avg: 0, max: 0, min: 0, total: 0 };
        const scores = data.map(s => s.score || 0);
        const total = data.length;
        const avg = (scores.reduce((a, b) => a + b, 0) / total).toFixed(1);
        const max = Math.max(...scores);
        const min = Math.min(...scores);
        return { avg, max, min, total };
      }, [data]);

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const json = JSON.parse(ev.target.result);
            setImportedData(Array.isArray(json) ? json : (json.data || []));
            showToast('已匯入外部作答資料進行分析');
          } catch (err) { alert('匯入格式錯誤'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="animate-scale-in space-y-6 max-w-[1600px] mx-auto pb-10">
          <div className="flex flex-wrap justify-between items-center gap-4 bg-white p-6 rounded-3xl border shadow-sm sticky top-0 z-[60]">
            <div>
              <h2 className="text-2xl font-black text-indigo-900 flex items-center gap-2"><BarChart3 /> 學生作答分析中心</h2>
              <p className="text-sm text-slate-400 font-bold">{session?.quizTitle || '分析資料'} | {importedData ? '歷史記錄模式' : '實時模式'}</p>
            </div>
            <div className="flex gap-2">
              <label className="bg-emerald-600 text-white px-5 py-2.5 rounded-2xl font-bold btn-quiz-action text-sm flex items-center gap-2 cursor-pointer shadow-lg">
                <Upload className="w-4 h-4" /> 匯入作答 JSON
                <input type="file" className="hidden" accept=".json" onChange={handleImport} />
              </label>
              <button onClick={onBack} className="bg-slate-800 text-white px-5 py-2.5 rounded-2xl font-bold btn-quiz-action text-sm">返回管理台</button>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
             <StatCard label="總作答人數" val={stats.total} unit="人" icon={<Users className="text-blue-500"/>} />
             <StatCard label="平均成績" val={stats.avg} unit="分" icon={<TrendingUp className="text-indigo-500"/>} />
             <StatCard label="最高分" val={stats.max} unit="分" icon={<Award className="text-yellow-500"/>} />
             <StatCard label="最低分" val={stats.min} unit="分" icon={<AlertTriangle className="text-red-500"/>} />
          </div>

          <div className="grid lg:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-[2rem] border shadow-sm lg:col-span-1">
               <h3 className="font-black text-slate-700 mb-4 flex items-center gap-2 border-b pb-3"><BookOpen className="text-indigo-600"/> 考試題目列表</h3>
               <div className="space-y-4 overflow-y-auto max-h-[600px] custom-scrollbar pr-2">
                 {questions.map((q, i) => (
                   <div key={i} className="p-4 bg-slate-50 rounded-2xl border border-slate-100 group">
                      <span className="text-[10px] font-black text-indigo-500 uppercase">Q{i+1} ({q.type==='choice'?'選擇':'申論'})</span>
                      <p className="text-sm font-bold text-slate-700 leading-relaxed">{q.question}</p>
                      <div className="mt-2 text-[10px] bg-white p-2 rounded-lg border italic text-emerald-600 font-bold">標答：{q.answer}</div>
                   </div>
                 ))}
               </div>
            </div>

            <div className="bg-white p-6 rounded-[2rem] border shadow-sm lg:col-span-2 overflow-hidden flex flex-col">
               <h3 className="font-black text-slate-700 mb-4 flex items-center gap-2 border-b pb-3"><Table2 className="text-indigo-600"/> 學生作答矩陣詳情</h3>
               <div className="flex-1 overflow-auto custom-scrollbar">
                  <table className="w-full border-collapse">
                    <thead>
                      <tr className="bg-slate-800 text-white text-[10px]">
                        <th className="p-3 text-left sticky left-0 bg-slate-800 z-20 min-w-[100px]">姓名</th>
                        <th className="p-3 text-center min-w-[60px]">得分</th>
                        {questions.map((_, i) => <th key={i} className="p-3 border-l border-slate-700 text-center min-w-[120px]">Q{i+1} 內容</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {data.sort((a,b) => (b.score||0)-(a.score||0)).map((s, idx) => (
                        <tr key={idx} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b text-xs hover:bg-indigo-50/50`}>
                          <td className="p-3 font-bold text-indigo-900 sticky left-0 bg-inherit shadow-md z-10">{s.studentName}</td>
                          <td className="p-3 text-center font-black text-indigo-600">{s.score || 0}</td>
                          {questions.map((q, qIdx) => {
                            const ans = s.answers?.[qIdx];
                            const isCorrect = q.type === 'choice' && ans === q.answer;
                            return (
                              <td key={qIdx} className={`p-3 border-l text-center ${isCorrect ? 'bg-emerald-50 text-emerald-700 font-bold' : ''}`}>
                                <div className="max-w-[150px] truncate mx-auto" title={ans}>{ans || '--'}</div>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
               </div>
            </div>
          </div>
        </div>
      );
    }

    function StatCard({ label, val, unit, icon }) {
      return (
        <div className="bg-white p-5 rounded-3xl border shadow-sm flex flex-col justify-between hover:scale-[1.02] transition-transform">
          <div className="flex justify-between items-start mb-2"><span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{label}</span>{icon}</div>
          <div className="text-2xl font-black text-slate-800">{val}<span className="text-xs ml-1 text-slate-400 font-bold">{unit}</span></div>
        </div>
      );
    }

    function StudentDashboard({ sessionData, myData, onAnswer, onFinalSubmit, showToast }) {
      const [localIdx, setLocalIdx] = useState(0);
      const [showOverview, setShowOverview] = useState(false);
      const [text, setText] = useState('');
      
      const activeIdx = localIdx;
      const q = sessionData.questions?.[activeIdx] || {};

      useEffect(() => { if (myData) setText(myData.answers?.[activeIdx] || ''); }, [activeIdx, myData]);
      
      useEffect(() => { 
        if (sessionData.status === 'sync_active') { 
          setLocalIdx(sessionData.currentQuestionIndex); 
          setShowOverview(false); 
        } 
      }, [sessionData.currentQuestionIndex, sessionData.status]);

      const jumpTo = (newIdx) => {
        if (text !== (myData?.answers?.[activeIdx] || '')) onAnswer(activeIdx, text);
        setLocalIdx(newIdx);
      };

      const handleSaveAndNext = () => {
        onAnswer(activeIdx, text); 
        if (activeIdx < sessionData.questions.length - 1) {
          setLocalIdx(prev => prev + 1); 
        } else {
          setShowOverview(true); 
        }
      };

      const isSubmitted = myData?.status === 'submitted';

      if (sessionData.status === 'lobby') return <div className="flex h-[60vh] flex-col items-center justify-center bg-white rounded-3xl animate-pulse"><Clock className="w-16 h-16 text-indigo-200 mb-6" /><h2 className="text-xl font-black">等待老師啟動測驗...</h2></div>;

      if (showOverview) {
        return (
          <div className="max-w-2xl mx-auto p-4 bg-white rounded-3xl shadow-xl animate-scale-in border border-slate-200 mt-4 flex flex-col h-[85vh]">
            <h2 className="text-xl font-bold border-b pb-4 flex items-center gap-2 text-indigo-900"><LayoutList /> 檢查全部答案</h2>
            <div className="flex-1 overflow-y-auto space-y-3 my-4 pr-2 custom-scrollbar">
              {sessionData.questions.map((q, i) => (
                <div key={i} className={`p-4 rounded-2xl border transition-all ${myData?.answers?.[i] ? 'bg-indigo-50 border-indigo-100' : 'bg-red-50 border-red-100'}`}>
                  <div className="flex justify-between items-start mb-1"><span className="font-bold text-xs text-slate-500">Q{i+1}. {q.question}</span></div>
                  <p className="text-sm font-bold text-slate-800 bg-white/50 p-2 rounded-lg border truncate">{myData?.answers?.[i] || <span className="text-red-500 italic">尚未填寫</span>}</p>
                </div>
              ))}
            </div>
            <div className="flex gap-4 pt-4 border-t">
              <button onClick={() => { setLocalIdx(0); setShowOverview(false); }} className="flex-1 p-4 bg-slate-800 text-white rounded-2xl font-bold btn-quiz-action text-sm">檢查答案</button>
              <button onClick={() => { if(window.confirm('答案一經送出，即無法再更改答案，確定送出?')){ onFinalSubmit(); setShowOverview(false); } }} className="flex-1 p-4 bg-red-600 text-white rounded-2xl font-bold btn-quiz-action shadow-lg text-sm flex items-center justify-center gap-2">檢查完畢，送出答案 <Send className="w-5 h-5"/></button>
            </div>
          </div>
        );
      }

      const isLastQuestion = activeIdx === sessionData.questions.length - 1;

      return (
        <div className="max-w-2xl mx-auto px-2 pb-10 animate-scale-in">
          {sessionData.status === 'review' && <div className="bg-red-600 text-white p-3 rounded-2xl text-center font-black text-sm mb-4 shadow-lg border-2 border-red-400">測驗已結束，答案已鎖定！</div>}
          {isSubmitted && <div className="bg-emerald-600 text-white p-3 rounded-2xl text-center font-black text-sm mb-4 shadow-lg border-2 border-emerald-400 animate-scale-in">作答已成功回傳老師端！</div>}

          <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center mb-4 shrink-0">
             <div className="flex flex-col"><span className="text-[10px] font-bold text-indigo-500 uppercase tracking-tighter">{sessionData.quizTitle}</span><h2 className="text-md font-bold text-slate-800">第 {activeIdx + 1} 題 / {sessionData.questions.length}</h2></div>
             <div className="flex gap-2">
                <TimerDisplay endTime={sessionData.questionEndTime} label="單題" alertMode={true}/>
                <TimerDisplay endTime={sessionData.totalEndTime} label="總時" alertMode={false}/>
             </div>
          </div>

          <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden mb-6 flex flex-col shrink-0 transition-all question-header-hover group">
            <div className="p-6 bg-indigo-50/50 border-b question-box-limit group-hover:bg-green-600 transition-colors">
              <div className="text-lg md:text-xl font-bold text-slate-800 leading-tight question-text">{q.question}</div>
            </div>
            <div className="p-6 bg-white">
              {q.type === 'choice' ? (
                <div className="grid grid-cols-1 gap-3">
                  {q.options?.map((opt, i) => {
                    const val = (i+1).toString();
                    return (
                      <button 
                        key={i} 
                        disabled={sessionData.status==='review' || isSubmitted} 
                        onClick={()=>{ setText(val); onAnswer(activeIdx, val); }} 
                        className={`p-4 rounded-2xl border-2 font-bold text-left text-sm transition-all choice-option-btn ${text === val ? 'bg-green-600 text-white border-green-700 scale-[1.02] shadow-lg' : 'bg-white border-slate-200 text-slate-700'} btn-quiz-action`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>
              ) : (
                <textarea 
                  className={`w-full p-4 border-2 rounded-2xl outline-none text-md h-32 transition-all disabled:bg-slate-100 disabled:text-slate-400 text-black font-medium focus:border-green-500`} 
                  placeholder="請在此輸入您的答案內容..." 
                  value={text} 
                  onChange={e => setText(e.target.value)} 
                  onBlur={() => onAnswer(activeIdx, text)} 
                  disabled={sessionData.status === 'review' || isSubmitted} 
                />
              )}
            </div>
          </div>

          <div className="flex gap-4 justify-center items-center w-full">
            <button 
              onClick={() => jumpTo(Math.max(0, activeIdx - 1))} 
              disabled={activeIdx === 0} 
              className={`flex-1 px-4 py-3 rounded-2xl font-bold btn-quiz-action flex items-center justify-center gap-1 text-sm ${activeIdx === 0 ? 'bg-slate-100 text-slate-300' : 'bg-slate-200 text-slate-700'}`}
            >
              <ChevronLeft className="w-4 h-4"/> 上一題
            </button>
            <button 
              onClick={handleSaveAndNext} 
              className="flex-1 px-4 py-3 bg-red-600 text-white rounded-2xl font-bold btn-quiz-action shadow-lg flex items-center justify-center gap-2 text-sm"
            >
              {isLastQuestion ? '已到最後一題' : '下一題'} 
              {isLastQuestion ? <LayoutList className="w-4 h-4"/> : <ChevronRight className="w-4 h-4"/>}
            </button>
          </div>
        </div>
      );
    }

    function TimerDisplay({ endTime, label, alertMode = false }) {
      const [t, setT] = useState(0);
      useEffect(() => { 
        if(!endTime) { setT(0); return; } 
        const tick = () => setT(Math.max(0, Math.floor((endTime - Date.now()) / 1000))); 
        tick(); const i = setInterval(tick, 1000); return () => clearInterval(i); 
      }, [endTime]);
      if(!endTime) return (<div className="px-2 py-1 rounded-xl border font-mono text-center bg-slate-50 text-slate-400 border-slate-200"><div className="text-[8px] font-bold uppercase leading-none opacity-40">{label}</div><div className="text-xs font-bold leading-tight">不設限</div></div>);
      const d = Math.floor(t / (24 * 3600)); 
      const h = Math.floor((t % (24 * 3600)) / 3600);
      const m = Math.floor((t % 3600) / 60).toString().padStart(2, '0');
      const s = (t % 60).toString().padStart(2, '0');
      return ( 
        <div className={`px-2 py-1 rounded-xl border font-mono text-center shadow-inner ${t < 60 && t > 0 && alertMode ? 'bg-red-50 text-red-600 animate-pulse border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
          <div className="text-[8px] font-bold uppercase leading-none opacity-60 tracking-tighter">{label}</div>
          <div className="text-xs font-bold leading-tight tracking-tighter">{d > 0 ? `${d}天 ` : ''}{h > 0 ? `${h}:` : ''}{m}:{s}</div>
        </div> 
      );
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
