<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上問卷系統 - 穩定修復版</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .btn-quiz-action {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-quiz-action:hover:not(:disabled) {
      background-color: #ef4444 !important; 
      color: white !important; 
      transform: scale(1.05); 
      z-index: 50;
      box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }
    .btn-quiz-action:active:not(:disabled) {
      transform: scale(0.95);
    }

    .choice-option-btn {
      transition: all 0.2s ease;
    }
    .choice-option-btn:hover:not(:disabled) {
      background-color: #16a34a !important;
      color: white !important;
      border-color: #15803d !important;
    }

    .question-header-hover:hover {
      background-color: #16a34a !important;
      color: white !important;
    }
    .question-header-hover:hover .question-text {
      color: white !important;
    }

    @media (max-width: 640px) {
      .mobile-full-height {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .question-box-limit {
        max-height: 35vh;
        overflow-y: auto;
      }
    }

    @keyframes scale-in {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scale-in {
      animation: scale-in 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Play, Square, Clock, Users, CheckCircle, ChevronRight, 
      ChevronLeft, Eye, ListChecks, ArrowRight, UserCircle, 
      LogOut, RefreshCw, Copy, Link as LinkIcon, Send, 
      Download, Upload, AlertTriangle, X, FileSearch, Edit3, Save, Lock, ClipboardList, Database, EyeOff, Calendar, LayoutList, BarChart3, PieChart, TrendingUp, Award, Table2, BookOpen, Sparkles, Calculator, Settings2, Trash2, ArrowUp, ArrowDown, ArrowUpDown
    } from 'https://esm.sh/lucide-react@0.292.0';

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Firebase 配置與初始化
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'online-survey-system-stable';

    const getShareableUrl = (code) => {
      const url = new URL(window.location.href);
      url.searchParams.set('code', code);
      return url.toString();
    };

    const copyToClipboard = (text) => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      return true;
    };

    const AI_PROMPT_TEMPLATE = `你是一位專業的問卷轉換助手。請將我貼上的問題文字檔轉換為適合「線上問卷系統」使用的 JSON 格式。

規則如下：
1. 輸出格式必須是單純的 JSON 陣列 (Array)。
2. 選擇題：
   - "type" 設為 "choice"
   - "question" 為問題敘述
   - "options" 為包含 4 個選項的陣列（需保留編號，如 "1. 選項文字"）
3. 申論題：
   - "type" 設為 "essay"
   - "question" 為問題敘述
4. 每一題必須包含遞增的 "id" 編號。`;

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [sessionCode, setSessionCode] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [sessionData, setSessionData] = useState(null);
      const [allAnswersData, setAllAnswersData] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [view, setView] = useState('main'); 
      
      const [quizBanks, setQuizBanks] = useState(() => {
        const saved = localStorage.getItem('secure_survey_banks_v3');
        return saved ? JSON.parse(saved) : {};
      });

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      // (1) 嚴格遵循 Rule 3: 登入邏輯
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            setErrorMsg("伺服器連線失敗，請稍後再試。");
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // (2) 監聽 Firestore 資料
      useEffect(() => {
        if (!user || !sessionCode) return;

        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', sessionCode);
        const unsubS = onSnapshot(sRef, (snap) => {
          if (snap.exists()) { 
            setSessionData(snap.data()); 
          } else if (role === 'customer') { 
            setRole(null); 
            setSessionCode(''); 
            setErrorMsg('問卷已關閉或無效。'); 
          }
        }, (err) => console.error("Session Error:", err));

        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAllAnswersData(docs.filter(a => a.sessionId === sessionCode));
        }, (err) => console.error("Answers Error:", err));

        return () => { unsubS(); unsubA(); };
      }, [user, sessionCode, role]);

      const handleCreate = async () => {
        if (!user) return;
        if (Object.keys(quizBanks).length === 0) {
          setErrorMsg("請先匯入問卷內容。");
          return;
        }
        const firstBankKey = Object.keys(quizBanks)[0];
        const currentBank = quizBanks[firstBankKey];
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, 
            status: 'lobby', 
            quizBankId: firstBankKey, 
            quizTitle: currentBank.name || "未命名問卷",
            questions: currentBank.questions, 
            currentQuestionIndex: 0, 
            totalQuizUnit: 'minutes', 
            totalQuizValue: 30,
            createdAt: Date.now()
          });
          setSessionCode(newCode); 
          setRole('sender');
        } catch (e) { setErrorMsg("問卷建立失敗。"); }
      };

      const handleJoin = async (code, name) => {
        if (!user) return;
        if (!code || !name) return setErrorMsg('請填寫完整資訊');
        const c = code.trim().toUpperCase();
        const n = name.trim();
        try {
          // (3) 驗證問卷代碼
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', c));
          if (!snap.exists()) return setErrorMsg('找不到代碼，請修正');
          
          const customerId = `${user.uid}_${n}`;
          const answerRef = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${c}_${customerId}`);
          const answerSnap = await getDoc(answerRef);
          
          if (!answerSnap.exists()) {
            await setDoc(answerRef, { 
              sessionId: c, 
              studentId: customerId, 
              studentName: n, 
              answers: {}, 
              status: 'in_progress', 
              joinedAt: Date.now() 
            });
          }
          setSessionCode(c); 
          setCustomerName(n); 
          setRole('customer');
        } catch (e) { 
          setErrorMsg("登入失敗，請確認網路狀態。"); 
        }
      };

      if (!user) return <div className="h-screen flex items-center justify-center text-slate-400 font-bold animate-pulse">連線中...</div>;

      return (
        <div className="min-h-screen flex flex-col mobile-full-height">
          <header className="bg-indigo-900 text-white p-4 shadow-lg flex justify-between items-center shrink-0">
            <h1 className="font-bold flex items-center gap-2 text-sm md:text-lg"><ListChecks /> 線上問卷系統</h1>
            {role && (
              <div className="bg-indigo-800 px-3 py-1 rounded-full flex gap-3 text-xs md:text-sm items-center">
                <span>{role === 'sender' ? '發送者管理端' : customerName}</span>
                <span className="font-mono text-yellow-300 font-bold">{sessionCode}</span>
                <button onClick={()=>{setRole(null); setSessionCode(''); setView('main');}} className="bg-red-500 hover:bg-red-600 px-2 py-0.5 rounded text-[10px] btn-quiz-action">離開</button>
              </div>
            )}
          </header>

          <main className="flex-1 max-w-7xl mx-auto p-2 md:p-8 w-full overflow-y-auto custom-scrollbar">
            {view === 'analysis' ? (
              <AnalysisDashboard onBack={() => setView('main')} currentStudents={allAnswersData} showToast={showToast} session={sessionData} />
            ) : (
              <>
                {!role && <RoleSelection onJoin={handleJoin} onCreate={handleCreate} onResume={(c)=>{setSessionCode(c.toUpperCase()); setRole('sender');}} hasBanks={Object.keys(quizBanks).length > 0} onImport={(b)=>{setQuizBanks(b); localStorage.setItem('secure_survey_banks_v3', JSON.stringify(b)); showToast('格式載入成功');}} />}
                
                {role === 'sender' && sessionData && (
                  <SenderView code={sessionCode} session={sessionData} students={allAnswersData} db={db} showToast={showToast} quizBanks={quizBanks} setQuizBanks={(b)=>{setQuizBanks(b); localStorage.setItem('secure_survey_banks_v3', JSON.stringify(b));}} onGoAnalysis={() => setView('analysis')} />
                )}
                
                {role === 'customer' && sessionData && (
                  <CustomerDashboard 
                    sessionData={sessionData} 
                    myData={allAnswersData.find(a => a.studentId === `${user.uid}_${customerName}`)} 
                    onAnswer={(idx, text) => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${customerName}`);
                      updateDoc(ref, { [`answers.${idx}`]: text });
                    }} 
                    onFinalSubmit={async () => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${customerName}`);
                      await updateDoc(ref, { status: 'submitted', submittedAt: Date.now() });
                      showToast('問卷已成功回傳！');
                    }}
                    showToast={showToast}
                  />
                )}
              </>
            )}
          </main>

          {errorMsg && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[100]"><div className="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-scale-in"><AlertTriangle className="mx-auto text-red-500 mb-4 w-10 h-10" /><p className="font-bold">{errorMsg}</p><button onClick={()=>setErrorMsg('')} className="mt-6 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold btn-quiz-action w-full">確認</button></div></div>}
          {toastMsg && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl animate-bounce z-50 flex items-center gap-2 text-sm"><CheckCircle className="text-green-400 w-4 h-4" />{toastMsg}</div>}
        </div>
      );
    }

    function RoleSelection({ onJoin, onCreate, onResume, hasBanks, onImport }) {
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [resCode, setResCode] = useState('');
      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            let normalized = {};
            if (Array.isArray(data)) { normalized = { "custom": { name: file.name.replace('.json',''), questions: data } }; } 
            else if (data.questions && Array.isArray(data.questions)) { normalized = { "custom": data }; } 
            else { normalized = data; }
            onImport(normalized);
          } catch(err) { alert('JSON 格式錯誤'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="mt-4 md:mt-10 grid md:grid-cols-2 gap-4 md:gap-8">
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 animate-scale-in">
            <h2 className="text-xl md:text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 客戶登入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="您的稱呼 / 公司名稱" className="w-full p-4 bg-slate-50 border rounded-2xl outline-none" value={name} onChange={e => setName(e.target.value)} />
              <input type="text" placeholder="輸入 4 碼問卷代碼" className="w-full p-4 bg-slate-50 border rounded-2xl font-mono uppercase outline-none" value={code} onChange={e => setCode(e.target.value)} />
              <button onClick={() => onJoin(code, name)} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg btn-quiz-action">進入問卷系統</button>
            </div>
          </div>
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between animate-scale-in">
            <div>
              <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Users /> 發送者管理端</h2>
              <div className="bg-indigo-50 p-4 rounded-2xl border mb-4">
                <label className="bg-white border-2 border-dashed border-indigo-200 p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer">
                   <Upload className="text-indigo-400 mb-1 w-5 h-5" />
                   <span className="text-indigo-700 font-bold text-xs">{hasBanks ? '更換問卷 JSON' : '匯入問卷內容 (JSON)'}</span>
                   <input type="file" className="hidden" accept=".json" onChange={handleImportFile}/>
                </label>
              </div>
              <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg btn-quiz-action">建立新問卷</button>
            </div>
            <div className="mt-6 border-t pt-4">
              <div className="flex gap-2">
                <input type="text" placeholder="恢復代碼" className="flex-1 p-2 border rounded-xl font-mono uppercase" value={resCode} onChange={e => setResCode(e.target.value)} />
                <button onClick={() => onResume(resCode)} className="bg-indigo-100 text-indigo-700 font-bold px-4 rounded-xl">恢復</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SenderView({ code, session, students, db, showToast, quizBanks, setQuizBanks, onGoAnalysis }) {
      const [showFullBankPreview, setShowFullBankPreview] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editForm, setEditForm] = useState({ question: '', options: [] });
      const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);

      const saveEdit = async () => {
        const updatedQuestions = [...session.questions];
        updatedQuestions[editingIndex] = { ...updatedQuestions[editingIndex], ...editForm };
        await updateDoc(sRef, { questions: updatedQuestions });
        setEditingIndex(null); 
        showToast('問卷內容已更新！');
      };

      return (
        <div className="space-y-6 animate-scale-in">
          {showFullBankPreview && (
            <div className="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
               <div className="bg-white w-full max-w-5xl h-full rounded-[2.5rem] flex flex-col shadow-2xl overflow-hidden">
                  <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                    <h2 className="text-xl font-black text-indigo-900">編輯問卷題目</h2>
                    <button onClick={() => { setShowFullBankPreview(false); setEditingIndex(null); }} className="p-2 bg-red-50 text-red-500 rounded-full"><X /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-8 custom-scrollbar space-y-4">
                    {session.questions?.map((q, idx) => (
                      <div key={idx} className={`bg-white p-6 rounded-3xl border ${editingIndex === idx ? 'border-indigo-500 ring-4 ring-indigo-50' : ''}`}>
                        {editingIndex === idx ? (
                          <div className="space-y-4">
                            <textarea className="w-full p-3 border rounded-xl outline-none" value={editForm.question} onChange={e=>setEditForm({...editForm, question: e.target.value})}/>
                            {q.type === 'choice' && (
                              <div className="grid grid-cols-2 gap-2">
                                {[0,1,2,3].map(i => (
                                  <input key={i} type="text" className="p-2 border rounded-lg" value={editForm.options[i] || ''} onChange={e=>{
                                    const newOpts = [...editForm.options]; newOpts[i] = e.target.value; setEditForm({...editForm, options: newOpts});
                                  }} />
                                ))}
                              </div>
                            )}
                            <div className="flex gap-2"><button onClick={saveEdit} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">儲存</button><button onClick={()=>setEditingIndex(null)} className="bg-slate-200 px-6 py-2 rounded-xl">取消</button></div>
                          </div>
                        ) : (
                          <div className="flex justify-between items-start">
                            <div>
                                <p className="font-bold">Q{idx+1}. {q.question}</p>
                                {q.type === 'choice' && <div className="grid grid-cols-2 gap-2 mt-2">{q.options?.map((opt, i) => <div key={i} className="text-xs bg-slate-50 p-2 rounded border">{opt}</div>)}</div>}
                            </div>
                            <button onClick={()=> { setEditingIndex(idx); setEditForm({question:q.question, options: q.options || []}); }} className="p-2 text-slate-400 hover:text-indigo-600"><Edit3 /></button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
               </div>
            </div>
          )}

          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <h2 className="text-xl font-bold text-indigo-900 mb-4">主控台</h2>
            <div className="p-3 bg-indigo-50 rounded-xl border flex items-center gap-2 mb-6">
              <span className="text-xs font-bold text-indigo-800">客戶線上回答網址:</span>
              <input type="text" readOnly className="flex-1 bg-white text-xs p-2 rounded border" value={getShareableUrl(code)} />
              <button onClick={() => { copyToClipboard(getShareableUrl(code)); showToast('已複製！'); }} className="bg-indigo-600 text-white px-4 py-1 rounded-lg text-xs font-bold">複製</button>
            </div>

            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-4">
                 <button onClick={() => setShowFullBankPreview(true)} className="bg-white border-2 border-indigo-600 text-indigo-600 p-4 rounded-xl font-bold">編輯問卷內容</button>
                 <button onClick={() => updateDoc(sRef, { status: 'submission_mode' })} className="bg-emerald-600 text-white p-4 rounded-xl font-bold">啟動：客戶有空再回答模式</button>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl">
                 <div>問卷調查中 ({session.quizTitle})</div>
                 <div className="flex gap-2">
                   <button onClick={onGoAnalysis} className="bg-indigo-600 px-4 py-2 rounded-xl text-xs font-bold">分析回答</button>
                   <button onClick={() => updateDoc(sRef, { status: 'review' })} className="bg-red-500 px-6 py-2 rounded-xl text-xs font-bold">結束問卷</button>
                 </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function AnalysisDashboard({ onBack, currentStudents, showToast, session }) {
      const questions = session?.questions || [];
      return (
        <div className="animate-scale-in space-y-6">
          <div className="flex justify-between items-center bg-white p-6 rounded-3xl border">
            <h2 className="text-2xl font-black text-indigo-900">客戶回答分析</h2>
            <button onClick={onBack} className="bg-slate-800 text-white px-5 py-2.5 rounded-2xl font-bold">返回</button>
          </div>
          <div className="bg-white p-6 rounded-[2rem] border overflow-x-auto">
             <table className="w-full text-xs">
                <thead className="bg-slate-100"><tr><th className="p-3 text-left">客戶姓名</th>{questions.map((_, i) => <th key={i} className="p-3">Q{i+1}</th>)}</tr></thead>
                <tbody>{currentStudents.map((s, idx) => (<tr key={idx} className="border-b"><td className="p-3 font-bold">{s.studentName}</td>{questions.map((_, i) => <td key={i} className="p-3 text-center text-slate-500">{s.answers?.[i] || '-'}</td>)}</tr>))}</tbody>
             </table>
          </div>
        </div>
      );
    }

    function CustomerDashboard({ sessionData, myData, onAnswer, onFinalSubmit, showToast }) {
      const [localIdx, setLocalIdx] = useState(0);
      const [showOverview, setShowOverview] = useState(false);
      const [text, setText] = useState('');
      const activeIdx = localIdx;
      const q = sessionData.questions?.[activeIdx] || {};

      useEffect(() => { if (myData) setText(myData.answers?.[activeIdx] || ''); }, [activeIdx, myData]);

      const handleSaveAndNext = () => {
        onAnswer(activeIdx, text); 
        
        // 第 3 題跳題邏輯: 回答 2 或 4 跳過第 4 題
        if (activeIdx === 2 && (text === '2' || text === '4')) {
            if (4 < sessionData.questions.length) {
                setLocalIdx(4);
                return;
            }
        }

        if (activeIdx < sessionData.questions.length - 1) {
            setLocalIdx(prev => prev + 1); 
        } else {
            setShowOverview(true); 
        }
      };

      const isSubmitted = myData?.status === 'submitted';
      if (sessionData.status === 'lobby') return <div className="h-[60vh] flex items-center justify-center font-bold">等待問卷啟動...</div>;

      if (showOverview) {
        return (
          <div className="max-w-2xl mx-auto p-4 bg-white rounded-3xl shadow-xl animate-scale-in border flex flex-col h-[85vh]">
            <h2 className="text-xl font-bold border-b pb-4 flex items-center gap-2 text-indigo-900"><LayoutList /> 再次檢查您的回覆</h2>
            <div className="flex-1 overflow-y-auto space-y-3 my-4 pr-2 custom-scrollbar">
              {sessionData.questions.map((q, i) => {
                const ansKey = myData?.answers?.[i];
                let displayVal = ansKey || <span className="text-red-500 italic">尚未填寫</span>;
                if (q.type === 'choice' && ansKey) {
                    const optIdx = parseInt(ansKey) - 1;
                    if (q.options?.[optIdx]) displayVal = q.options[optIdx];
                }
                return (
                  <div key={i} className={`p-4 rounded-2xl border ${myData?.answers?.[i] ? 'bg-indigo-50' : 'bg-red-50'}`}>
                    <div className="text-xs text-slate-500 font-bold mb-1">Q{i+1}. {q.question}</div>
                    <p className="text-sm font-bold text-slate-800">{displayVal}</p>
                  </div>
                );
              })}
            </div>
            <div className="flex gap-4 pt-4 border-t">
              <button onClick={() => { setLocalIdx(0); setShowOverview(false); }} className="flex-1 p-4 bg-slate-800 text-white rounded-2xl font-bold">重新作答</button>
              <button onClick={() => { if(window.confirm('確定送出？')){ onFinalSubmit(); setShowOverview(false); } }} className="flex-1 p-4 bg-red-600 text-white rounded-2xl font-bold">正式送出</button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto px-2 pb-10 animate-scale-in">
          {isSubmitted && <div className="bg-emerald-600 text-white p-4 rounded-2xl text-center font-bold mb-4">感謝參與，回答已送出！</div>}
          <div className="bg-white p-4 rounded-2xl shadow-sm border mb-4">
             <h2 className="text-md font-bold">問題 {activeIdx + 1} / {sessionData.questions.length}</h2>
          </div>
          <div className="bg-white rounded-3xl shadow-xl border overflow-hidden mb-6 flex flex-col group">
            <div className="p-6 bg-indigo-50/50 border-b group-hover:bg-green-600 transition-colors">
              <div className="text-lg font-bold text-slate-800 question-text">{q.question}</div>
            </div>
            <div className="p-6">
              {q.type === 'choice' ? (
                <div className="grid grid-cols-1 gap-3">
                  {q.options?.map((opt, i) => {
                    const val = (i+1).toString();
                    return (
                      <button key={i} disabled={isSubmitted} onClick={()=>{ setText(val); onAnswer(activeIdx, val); }} className={`p-4 rounded-2xl border-2 font-bold text-left transition-all ${text === val ? 'bg-green-600 text-white border-green-700' : 'bg-white'} btn-quiz-action`}>{opt}</button>
                    );
                  })}
                </div>
              ) : (
                <textarea className="w-full p-4 border-2 rounded-2xl outline-none h-32 focus:border-green-500" placeholder="請在此輸入您的回覆..." value={text} onChange={e => setText(e.target.value)} onBlur={() => onAnswer(activeIdx, text)} disabled={isSubmitted} />
              )}
            </div>
          </div>
          <div className="flex gap-4">
            <button onClick={() => setLocalIdx(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} className="flex-1 px-4 py-3 bg-slate-200 rounded-2xl font-bold btn-quiz-action text-sm">上一個問題</button>
            <button onClick={handleSaveAndNext} className="flex-1 px-4 py-3 bg-red-600 text-white rounded-2xl font-bold btn-quiz-action shadow-lg text-sm">{activeIdx === sessionData.questions.length-1 ? '再次檢查您的回覆' : '下一個問題'}</button>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
