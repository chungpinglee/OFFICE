<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上問卷系統 - 旗艦功能恢復版</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .btn-quiz-action {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-quiz-action:hover:not(:disabled) {
      background-color: #ef4444 !important; 
      color: white !important; 
      transform: scale(1.05); 
      z-index: 50;
      box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }
    .btn-quiz-action:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* AI 提示詞按鈕專屬特效 */
    .ai-btn-custom {
      transition: all 0.3s ease;
      background-color: #f5f3ff; /* indigo-50 */
      color: #4338ca; /* indigo-700 */
      border: 1px solid #c7d2fe; /* indigo-200 */
    }
    .ai-btn-custom:hover {
      background-color: #ef4444 !important; /* 紅色填滿 */
      color: white !important; /* 文字白色 */
      border-color: #ef4444 !important;
    }

    .choice-option-btn {
      transition: all 0.2s ease;
    }
    .choice-option-btn:hover:not(:disabled) {
      background-color: #16a34a !important;
      color: white !important;
      border-color: #15803d !important;
    }

    @media (max-width: 640px) {
      .mobile-full-height {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .question-box-limit {
        max-height: 35vh;
        overflow-y: auto;
      }
    }

    @keyframes scale-in {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scale-in {
      animation: scale-in 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      ListChecks, UserCircle, Users, Upload, Edit3, Send, ClipboardList, Database, FileSearch, Sparkles, LayoutList, BarChart3, BookOpen, Table2, Trash2, X, AlertTriangle, CheckCircle, Copy, Download, Calculator, Clock, Play, Square, TrendingUp, Award, ArrowUp, ArrowDown, ArrowUpDown
    } from 'https://esm.sh/lucide-react@0.292.0';

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // 🚀 安全讀取 Firebase 配置，防止畫面空白
    let firebaseConfig = {};
    try {
      firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project"
      };
    } catch (e) {
      console.warn("Firebase config not found, using demo mode.");
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'online-survey-system-v3';

    const getShareableUrl = (code) => {
      const url = new URL(window.location.href);
      url.searchParams.set('code', code);
      return url.toString();
    };

    const copyToClipboard = (text) => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      return true;
    };

    const AI_PROMPT_TEMPLATE = `你是一位專業的問卷轉換助手。請將我貼上的題目文字檔轉換為適合「線上問卷系統」使用的 JSON 格式。

規則如下：
1. 輸出格式必須是單純的 JSON 陣列 (Array)。
2. 選擇題："type"設為"choice", "options"為包含4個選項的陣列。
3. 申論題："type"設為"essay"。
4. 每一題必須包含遞增的 "id" 編號。`;

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [sessionCode, setSessionCode] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [sessionData, setSessionData] = useState(null);
      const [allAnswersData, setAllAnswersData] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [view, setView] = useState('main');
      const [isAuthenticating, setIsAuthenticating] = useState(true);
      
      const [quizBanks, setQuizBanks] = useState(() => {
        const saved = localStorage.getItem('survey_banks_v3_full');
        return saved ? JSON.parse(saved) : {};
      });

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) { 
            console.error("Auth error", e);
          } finally { 
            setIsAuthenticating(false); 
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user || !sessionCode) return;
        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', sessionCode);
        const unsubS = onSnapshot(sRef, (snap) => {
          if (snap.exists()) { setSessionData(snap.data()); } 
          else if (role === 'customer') { setRole(null); setSessionCode(''); setErrorMsg('問卷已關閉。'); }
        });
        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAllAnswersData(docs.filter(a => a.sessionId === sessionCode));
        });
        return () => { unsubS(); unsubA(); };
      }, [user, sessionCode, role]);

      const handleCreate = async () => {
        if (!user) return;
        if (Object.keys(quizBanks).length === 0) return setErrorMsg("請先匯入問卷內容。");
        const firstBankKey = Object.keys(quizBanks)[0];
        const currentBank = quizBanks[firstBankKey];
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, status: 'lobby', quizBankId: firstBankKey, quizTitle: currentBank.name || "未命名問卷",
            questions: currentBank.questions.map(q => ({ ...q, weight: 10 })), 
            currentQuestionIndex: 0, 
            perQuestionUnit: 'unlimited', perQuestionValue: 5,
            totalQuizUnit: 'minutes', totalQuizValue: 30,
            revealedAnswers: [], createdAt: Date.now(),
            gradingStep: 0, scoringMode: 'even'
          });
          setSessionCode(newCode); setRole('sender');
        } catch (e) { setErrorMsg("建立失敗。"); }
      };

      const handleJoin = async (code, name) => {
        if (!user) return;
        if (!code || !name) return setErrorMsg('請填寫完整資訊');
        const c = code.trim().toUpperCase();
        const n = name.trim();
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', c));
          if (!snap.exists()) return setErrorMsg('找不到代碼，請修正');
          const customerId = `${user.uid}_${n}`;
          const answerRef = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${c}_${customerId}`);
          const answerSnap = await getDoc(answerRef);
          if (!answerSnap.exists()) {
            await setDoc(answerRef, { sessionId: c, studentId: customerId, studentName: n, answers: {}, status: 'in_progress', joinedAt: Date.now() });
          }
          setSessionCode(c); setCustomerName(n); setRole('customer');
        } catch (e) { setErrorMsg("登入失敗。"); }
      };

      if (isAuthenticating) return <div className="h-screen flex items-center justify-center font-bold text-slate-400">系統初始化中...</div>;

      return (
        <div className="min-h-screen flex flex-col mobile-full-height">
          <header className="bg-indigo-900 text-white p-4 shadow-lg flex justify-between items-center shrink-0">
            <h1 className="font-bold flex items-center gap-2"><ListChecks /> 線上問卷系統</h1>
            {role && (
              <div className="bg-indigo-800 px-3 py-1 rounded-full flex gap-3 text-xs md:text-sm items-center">
                <span>{role === 'sender' ? '發送者管理端' : customerName}</span>
                <span className="font-mono text-yellow-300 font-bold">{sessionCode}</span>
                <button onClick={()=>{setRole(null); setSessionCode(''); setView('main');}} className="bg-red-500 hover:bg-red-600 px-2 py-0.5 rounded text-[10px] btn-quiz-action">離開</button>
              </div>
            )}
          </header>

          <main className="flex-1 max-w-7xl mx-auto p-4 md:p-8 w-full overflow-y-auto custom-scrollbar">
            {view === 'analysis' ? (
              <AnalysisDashboard onBack={() => setView('main')} currentStudents={allAnswersData} session={sessionData} showToast={showToast} />
            ) : (
              <>
                {!role && <RoleSelection onJoin={handleJoin} onCreate={handleCreate} onResume={(c)=>{setSessionCode(c.toUpperCase()); setRole('sender');}} hasBanks={Object.keys(quizBanks).length > 0} onImport={(b)=>{setQuizBanks(b); localStorage.setItem('survey_banks_v3_full', JSON.stringify(b)); showToast('問卷格式載入成功');}} showToast={showToast} />}
                
                {role === 'sender' && sessionData && (
                  <SenderView code={sessionCode} session={sessionData} students={allAnswersData} db={db} showToast={showToast} quizBanks={quizBanks} setQuizBanks={setQuizBanks} onGoAnalysis={() => setView('analysis')} />
                )}
                
                {role === 'customer' && sessionData && (
                  <CustomerDashboard 
                    sessionData={sessionData} 
                    myData={allAnswersData.find(a => a.studentId === `${user.uid}_${customerName}`)} 
                    onAnswer={(idx, text) => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${customerName}`);
                      updateDoc(ref, { [`answers.${idx}`]: text });
                    }} 
                    onFinalSubmit={async () => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${customerName}`);
                      await updateDoc(ref, { status: 'submitted', submittedAt: Date.now() });
                      showToast('問卷已成功回傳！');
                    }}
                    showToast={showToast}
                  />
                )}
              </>
            )}
          </main>

          {errorMsg && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[100]"><div className="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-scale-in"><AlertTriangle className="mx-auto text-red-500 mb-4 w-10 h-10" /><p className="font-bold">{errorMsg}</p><button onClick={()=>setErrorMsg('')} className="mt-6 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold btn-quiz-action w-full">確認</button></div></div>}
          {toastMsg && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl animate-bounce z-50 flex items-center gap-2 text-sm"><CheckCircle className="text-green-400 w-4 h-4" />{toastMsg}</div>}
        </div>
      );
    }

    function RoleSelection({ onJoin, onCreate, onResume, hasBanks, onImport, showToast }) {
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [resCode, setResCode] = useState('');
      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            let normalized = {};
            if (Array.isArray(data)) { normalized = { "custom": { name: file.name.replace('.json',''), questions: data } }; } 
            else if (data.questions && Array.isArray(data.questions)) { normalized = { "custom": data }; } 
            else { normalized = data; }
            onImport(normalized);
          } catch(err) { alert('JSON 格式錯誤'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="mt-4 md:mt-10 grid md:grid-cols-2 gap-4 md:gap-8 animate-scale-in">
          <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
            <h2 className="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 客戶登入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="您的稱呼 / 公司名稱" className="w-full p-4 bg-slate-50 border rounded-2xl outline-none" value={name} onChange={e => setName(e.target.value)} />
              <input type="text" placeholder="輸入 4 碼問卷代碼" className="w-full p-4 bg-slate-50 border rounded-2xl font-mono uppercase" value={code} onChange={e => setCode(e.target.value)} />
              <button onClick={() => onJoin(code, name)} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg btn-quiz-action">進入問卷系統</button>
            </div>
          </div>
          <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
              <h2 className="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Users /> 發送者管理端</h2>
              <div className="bg-indigo-50 p-4 rounded-2xl border mb-4">
                <label className="bg-white border-2 border-dashed border-indigo-200 p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer">
                   <Upload className="text-indigo-400 mb-1 w-5 h-5" />
                   <span className="text-indigo-700 font-bold text-xs">{hasBanks ? '變更問卷 JSON' : '匯入問卷內容 (JSON)'}</span>
                   <input type="file" className="hidden" accept=".json" onChange={handleImportFile}/>
                </label>
              </div>
              <div className="space-y-2">
                <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg btn-quiz-action">建立新問卷</button>
                <button 
                  onClick={() => { copyToClipboard(AI_PROMPT_TEMPLATE); showToast('複製成功'); }} 
                  className="ai-btn-custom w-full py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-2"
                >
                  <Sparkles className="w-4 h-4" /> 複製 AI 轉檔提示詞
                </button>
              </div>
            </div>
            <div className="mt-6 border-t pt-4">
              <div className="flex gap-2">
                <input type="text" placeholder="恢復代碼" className="flex-1 p-2 border rounded-xl font-mono uppercase" value={resCode} onChange={e => setResCode(e.target.value)} />
                <button onClick={() => onResume(resCode)} className="bg-indigo-100 text-indigo-700 font-bold px-4 rounded-xl">恢復</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SenderView({ code, session, students, db, showToast, quizBanks, setQuizBanks, onGoAnalysis }) {
      const [showFullBankPreview, setShowFullBankPreview] = useState(false);
      const [showResultsModal, setShowResultsModal] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editForm, setEditForm] = useState({ question: '', options: [] });
      const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);

      const saveEdit = async () => {
        const updated = [...session.questions];
        updated[editingIndex] = { ...updated[editingIndex], ...editForm };
        await updateDoc(sRef, { questions: updated });
        setEditingIndex(null); 
        showToast('問卷內容已更新！');
      };

      const exportJSON = (data, name) => {
        const jsonStr = JSON.stringify(data, null, 2);
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr);
        const anchor = document.createElement('a'); 
        anchor.setAttribute("href", dataStr); anchor.setAttribute("download", `${name}.json`);
        document.body.appendChild(anchor); anchor.click(); document.body.removeChild(anchor);
      };

      return (
        <div className="space-y-6 animate-scale-in">
          {showFullBankPreview && (
            <div className="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-4">
               <div className="bg-white w-full max-w-5xl h-[85vh] rounded-[2.5rem] flex flex-col shadow-2xl overflow-hidden">
                  <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                    <h2 className="text-xl font-black text-indigo-900">編輯問卷題目與邏輯</h2>
                    <div className="flex gap-2">
                       <button onClick={() => exportJSON(session.questions, `${session.quizTitle}_修改編輯後問卷`)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 btn-quiz-action"><Download className="w-4 h-4"/> 匯出目前編輯後的問卷 JSON</button>
                       <button onClick={() => { setShowFullBankPreview(false); setEditingIndex(null); }} className="p-2 bg-red-50 text-red-500 rounded-full"><X /></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
                    {session.questions?.map((q, idx) => (
                      <div key={idx} className={`bg-white p-6 rounded-3xl border transition-all ${editingIndex === idx ? 'border-indigo-500 ring-4 ring-indigo-50' : ''}`}>
                        {editingIndex === idx ? (
                          <div className="space-y-4">
                            <textarea className="w-full p-3 border rounded-xl" value={editForm.question} onChange={e=>setEditForm({...editForm, question: e.target.value})}/>
                            {q.type === 'choice' && (
                              <div className="grid grid-cols-2 gap-2">
                                {[0,1,2,3].map(i => (
                                  <input key={i} type="text" className="p-2 border rounded-lg" value={editForm.options[i] || ''} onChange={e=>{
                                    const o = [...editForm.options]; o[i] = e.target.value; setEditForm({...editForm, options: o});
                                  }} placeholder={`選項 ${i+1}`} />
                                ))}
                              </div>
                            )}
                            <div className="flex gap-2">
                              <button onClick={saveEdit} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold btn-quiz-action">儲存修改</button>
                              <button onClick={()=>setEditingIndex(null)} className="bg-slate-200 px-6 py-2 rounded-xl">取消</button>
                            </div>
                          </div>
                        ) : (
                          <div className="flex justify-between items-start">
                            <div className="flex-1">
                                <p className="font-bold">Q{idx+1}. {q.question}</p>
                                {q.type === 'choice' && <div className="grid grid-cols-2 gap-2 mt-2">{q.options?.map((opt, i) => <div key={i} className="text-xs text-slate-500 bg-slate-50 p-2 rounded border">{opt}</div>)}</div>}
                                {idx === 2 && <p className="text-[10px] text-red-500 mt-2 font-bold">※ 此題設有跳題邏輯：若客戶回答 2 或 4，將跳至 Q5。</p>}
                                {idx === 5 && <p className="text-[10px] text-indigo-500 mt-2 font-bold">※ 此題設有專屬輸入邏輯：包含「否」與「如下所述：」選單。</p>}
                            </div>
                            <button onClick={()=> { setEditingIndex(idx); setEditForm({question:q.question, options: q.options || []}); }} className="p-2 text-slate-400 hover:text-indigo-600"><Edit3 /></button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
               </div>
            </div>
          )}

          {showResultsModal && (
            <div className="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-2 backdrop-blur-md">
               <div className="bg-white w-full max-w-7xl h-[90vh] rounded-[2rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-6 border-b flex justify-between items-center bg-indigo-50">
                    <h2 className="text-xl font-black text-indigo-900 flex items-center gap-2"><ClipboardList /> 客戶回答詳情總表</h2>
                    <div className="flex gap-2">
                       <button onClick={()=>exportJSON(students, `${session.quizTitle}_詳細資料`)} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs btn-quiz-action">匯出 JSON</button>
                       <button onClick={() => setShowResultsModal(false)} className="p-2 border rounded-full"><X /></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-auto p-4 custom-scrollbar">
                    <table className="w-full text-left border-collapse min-w-[1000px]">
                      <thead><tr className="bg-slate-800 text-white text-[10px]"><th className="p-3 sticky left-0 bg-slate-800">客戶</th><th className="p-3 text-center">狀態</th>{session.questions.map((_, i) => <th key={i} className="p-3 border-l border-slate-700">Q{i+1}</th>)}</tr></thead>
                      <tbody>{students.map((s, idx) => (<tr key={idx} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b text-xs`}><td className="p-3 font-bold sticky left-0 bg-inherit shadow-md">{s.studentName}</td><td className="p-3 text-center">{s.status === 'submitted' ? '✅ 已送出' : '📝 填寫中'}</td>{session.questions.map((_, i) => (<td key={i} className="p-3 border-l text-slate-600 truncate max-w-[200px]">{s.answers?.[i] || '-'}</td>))}</tr>))}</tbody>
                    </table>
                  </div>
               </div>
            </div>
          )}

          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-indigo-900">主控台</h2>
              <div className="flex gap-4">
                <TimerDisplay endTime={session.questionEndTime} label="單題限時" />
                <TimerDisplay endTime={session.totalEndTime} label="總時長" />
              </div>
            </div>

            <div className="p-3 bg-indigo-50 rounded-xl border flex items-center gap-2 mb-6 text-xs">
              <span className="font-bold text-indigo-800">客戶線上回答網址:</span>
              <input type="text" readOnly className="flex-1 bg-white p-2 rounded border" value={getShareableUrl(code)} />
              <button onClick={()=>{copyToClipboard(getShareableUrl(code)); showToast('連結已複製！');}} className="bg-indigo-600 text-white px-4 py-1 rounded-lg font-bold btn-quiz-action">複製</button>
            </div>
            
            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-6">
                <div className="space-y-4">
                  <div className="flex gap-2">
                    <button onClick={() => setShowFullBankPreview(true)} className="flex-1 bg-white border-2 border-indigo-600 text-indigo-600 p-3 rounded-xl text-sm font-bold shadow-sm btn-quiz-action">編輯問卷內容</button>
                    <button onClick={onGoAnalysis} className="flex-1 bg-indigo-100 border-2 border-indigo-300 text-indigo-700 p-3 rounded-xl text-sm font-bold shadow-sm btn-quiz-action">回答分析</button>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-2xl border space-y-3">
                    <div className="flex flex-col gap-1">
                      <label className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">單題回答限時設定</label>
                      <div className="flex gap-2 items-center">
                         <select className="flex-1 p-2 bg-white border rounded-xl text-xs" value={session.perQuestionUnit || 'unlimited'} onChange={e => updateDoc(sRef, { perQuestionUnit: e.target.value })}>
                            <option value="unlimited">不設限</option>
                            <option value="seconds">秒</option>
                            <option value="minutes">分</option>
                         </select>
                         {session.perQuestionUnit !== 'unlimited' && (
                           <input type="number" className="w-16 p-2 bg-white border rounded-xl text-xs" value={session.perQuestionValue || 5} onChange={e => updateDoc(sRef, { perQuestionValue: Number(e.target.value) })} />
                         )}
                      </div>
                    </div>
                    <div className="flex flex-col gap-1">
                      <label className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">問卷總時長設定</label>
                      <div className="flex gap-2 items-center">
                        <select className="flex-1 p-2 bg-white border rounded-xl text-xs" value={session.totalQuizUnit || 'minutes'} onChange={e => updateDoc(sRef, { totalQuizUnit: e.target.value })}>
                          <option value="unlimited">不設限</option>
                          <option value="minutes">分</option>
                          <option value="hours">時</option>
                        </select>
                        {session.totalQuizUnit !== 'unlimited' && <input type="number" className="w-16 p-2 bg-white border rounded-xl text-xs" value={session.totalQuizValue || 30} onChange={e => updateDoc(sRef, { totalQuizValue: Number(e.target.value) })} />}
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex flex-col gap-3 justify-center">
                  <button onClick={() => updateDoc(sRef, { status: 'sync_active', currentQuestionIndex: 0, totalEndTime: Date.now() + (session.totalQuizValue * 60000) })} className="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold shadow-lg btn-quiz-action">啟動：客戶統一時間同步回答模式</button>
                  <button onClick={() => updateDoc(sRef, { status: 'submission_mode', totalEndTime: null })} className="w-full bg-emerald-600 text-white p-4 rounded-2xl font-bold shadow-lg btn-quiz-action">啟動：客戶有空再回答模式</button>
                  <div className="flex gap-2">
                    <button onClick={() => setShowResultsModal(true)} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl text-xs font-bold btn-quiz-action">客戶回答總表</button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl">
                 <div className="text-sm">
                   <span className="text-indigo-400 font-bold uppercase tracking-widest block text-[10px]">{session.status === 'submission_mode' ? '自由回答中' : '同步進行中'}</span>
                   {session.quizTitle}
                 </div>
                 <div className="flex gap-2">
                   <button onClick={onGoAnalysis} className="px-4 py-2 bg-indigo-600 rounded-xl text-xs font-bold btn-quiz-action">查看分析</button>
                   <button onClick={() => updateDoc(sRef, { status: 'review', totalEndTime: null })} className="px-4 py-2 bg-red-500 rounded-xl text-xs font-bold btn-quiz-action">結束問卷</button>
                 </div>
              </div>
            )}
          </div>

          <div className="grid lg:grid-cols-3 gap-6 mt-6">
            <div className="lg:col-span-2 bg-white p-6 rounded-3xl border shadow-sm h-fit">
               <h3 className="text-lg font-bold border-b pb-4 mb-4">當前題目: Q{session.currentQuestionIndex+1}</h3>
               <p className="text-2xl font-bold text-slate-700 leading-relaxed">{session.questions?.[session.currentQuestionIndex]?.question}</p>
            </div>
            <div className="bg-white p-6 rounded-3xl border h-[400px] overflow-y-auto custom-scrollbar shadow-sm">
               <h3 className="text-md font-bold text-slate-700 border-b pb-3 mb-4 flex justify-between">在線客戶 <span>{students.length} 人</span></h3>
               {students.map(s => (<div key={s.id} className="p-3 bg-slate-50 rounded-2xl border mb-2 flex justify-between items-center animate-scale-in"><span className="text-sm font-bold">{s.studentName} {s.status === 'submitted' && '✅'}</span></div>))}
            </div>
          </div>
        </div>
      );
    }

    function AnalysisDashboard({ onBack, currentStudents, session, showToast }) {
      const questions = session?.questions || [];
      return (
        <div className="animate-scale-in space-y-6 max-w-[1600px] mx-auto pb-10">
          <div className="flex justify-between items-center bg-white p-6 rounded-3xl border shadow-sm">
            <div>
              <h2 className="text-2xl font-black text-indigo-900 flex items-center gap-2"><BarChart3/> 回答分析中心</h2>
              <p className="text-xs text-slate-400 font-bold">{session?.quizTitle}</p>
            </div>
            <button onClick={onBack} className="bg-slate-800 text-white px-6 py-2.5 rounded-2xl font-bold btn-quiz-action">返回主控台</button>
          </div>
          <div className="bg-white p-6 rounded-[2rem] border overflow-x-auto shadow-sm">
            <table className="w-full text-xs text-left border-collapse">
              <thead><tr className="bg-slate-100 border-b"><th className="p-4">客戶姓名</th><th className="p-4">時間</th>{questions.map((_, i) => <th key={i} className="p-4 border-l">Q{i+1}</th>)}</tr></thead>
              <tbody>{currentStudents.map((s, idx) => (<tr key={idx} className="border-b hover:bg-indigo-50/30"><td className="p-4 font-bold text-indigo-900">{s.studentName}</td><td className="p-4 text-slate-400 font-mono">{s.submittedAt ? new Date(s.submittedAt).toLocaleTimeString() : '--'}</td>{questions.map((_, i) => <td key={i} className="p-4 border-l text-slate-500">{s.answers?.[i] || '-'}</td>)}</tr>))}</tbody>
            </table>
          </div>
        </div>
      );
    }

    function CustomerDashboard({ sessionData, myData, onAnswer, onFinalSubmit, showToast }) {
      const [localIdx, setLocalIdx] = useState(0);
      const [showReview, setShowReview] = useState(false);
      const [text, setText] = useState('');
      const activeIdx = localIdx;
      const q = sessionData.questions?.[activeIdx] || {};

      useEffect(() => { 
        if (myData) {
          const val = myData.answers?.[activeIdx] || '';
          setText(val);
        }
      }, [activeIdx, myData]);
      
      useEffect(() => { if (sessionData.status === 'sync_active') { setLocalIdx(sessionData.currentQuestionIndex); setShowReview(false); } }, [sessionData.currentQuestionIndex, sessionData.status]);

      const handleNext = () => {
        onAnswer(activeIdx, text);
        
        // Q3 (Index 2) 跳題邏輯
        if (activeIdx === 2 && (text === '2' || text === '4')) {
          if (4 < sessionData.questions.length) { setLocalIdx(4); return; }
        }

        if (activeIdx < sessionData.questions.length - 1) setLocalIdx(activeIdx + 1);
        else setShowReview(true);
      };

      const isSubmitted = myData?.status === 'submitted';
      if (sessionData.status === 'lobby') return <div className="h-[60vh] flex flex-col items-center justify-center font-bold animate-pulse text-indigo-300">等待問卷啟動...</div>;

      if (showReview) {
        return (
          <div className="max-w-2xl mx-auto p-4 bg-white rounded-3xl shadow-xl border flex flex-col h-[85vh] animate-scale-in">
            <h2 className="text-xl font-bold border-b pb-4 text-indigo-900 flex items-center gap-2"><LayoutList/> 再次檢查您的回覆</h2>
            <div className="flex-1 overflow-y-auto space-y-3 my-4 pr-2 custom-scrollbar">
              {sessionData.questions.map((q, i) => {
                const ans = myData?.answers?.[i];
                let display = ans || <span className="text-red-400 italic">尚未回答</span>;
                if (q.type === 'choice' && ans) {
                  const opt = q.options[parseInt(ans)-1];
                  if (opt) display = opt;
                }
                return (
                  <div key={i} className={`p-4 rounded-2xl border ${ans ? 'bg-indigo-50 border-indigo-100' : 'bg-red-50 border-red-100'}`}>
                    <p className="text-xs text-slate-500 font-bold mb-1">Q{i+1}. {q.question}</p>
                    <p className="font-bold text-slate-800">{display}</p>
                  </div>
                );
              })}
            </div>
            <div className="flex gap-4 pt-4 border-t">
              <button onClick={() => { setLocalIdx(0); setShowReview(false); }} className="flex-1 p-4 bg-slate-800 text-white rounded-2xl font-bold btn-quiz-action">重新作答</button>
              <button onClick={() => { if(confirm('送出後將無法修改，確定送出？')){ onFinalSubmit(); setShowReview(false); } }} className="flex-1 p-4 bg-red-600 text-white rounded-2xl font-bold shadow-lg btn-quiz-action">正式送出</button>
            </div>
          </div>
        );
      }

      // 🛠️ 特別處理 Q6 (索引 5)
      const renderQuestionContent = () => {
        if (activeIdx === 5) {
          const isAsFollows = text && text !== '否' && text !== '';
          return (
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <button 
                  disabled={isSubmitted} 
                  onClick={()=>{setText('否'); onAnswer(5, '否');}} 
                  className={`p-4 rounded-2xl border-2 font-bold transition-all ${text === '否' ? 'bg-green-600 text-white border-green-700 shadow-md' : 'bg-white border-slate-200'} btn-quiz-action`}
                >否</button>
                <button 
                  disabled={isSubmitted} 
                  onClick={()=>{ if(text === '否') setText('如下所述：'); }} 
                  className={`p-4 rounded-2xl border-2 font-bold transition-all ${ (text !== '否' && text !== '') ? 'bg-green-600 text-white border-green-700 shadow-md' : 'bg-white border-slate-200'} btn-quiz-action`}
                >如下所述：</button>
              </div>
              { (text !== '否' && text !== '') && (
                <textarea 
                  className="w-full p-4 border-2 rounded-2xl h-32 focus:border-green-500 outline-none animate-scale-in" 
                  placeholder="請在此輸入詳細內容..." 
                  value={text === '如下所述：' ? '' : text} 
                  onChange={e => { setText(e.target.value); onAnswer(5, e.target.value); }} 
                  disabled={isSubmitted} 
                />
              )}
            </div>
          );
        }

        if (q.type === 'choice') {
          return (
            <div className="grid grid-cols-1 gap-3">
              {q.options?.map((opt, i) => {
                const v = (i+1).toString();
                return (
                  <button key={i} disabled={isSubmitted} onClick={()=>{setText(v); onAnswer(activeIdx, v);}} className={`p-4 rounded-2xl border-2 font-bold text-left transition-all ${text === v ? 'bg-green-600 text-white border-green-700 shadow-md' : 'bg-white border-slate-200'} btn-quiz-action`}>{opt}</button>
                );
              })}
            </div>
          );
        }

        return (
          <textarea className="w-full p-4 border-2 rounded-2xl h-32 focus:border-green-500 outline-none" placeholder="請在此輸入內容..." value={text} onChange={e=>setText(e.target.value)} onBlur={()=>onAnswer(activeIdx, text)} disabled={isSubmitted} />
        );
      };

      return (
        <div className="max-w-2xl mx-auto px-2 pb-10 animate-scale-in">
          {myData?.status === 'submitted' && <div className="bg-emerald-600 text-white p-4 rounded-2xl text-center font-bold mb-4 shadow-md">問卷已回傳，感謝您的回饋！</div>}
          <div className="bg-white p-4 rounded-2xl shadow-sm border mb-4 flex justify-between items-center">
             <h2 className="font-bold text-indigo-900">問題 {activeIdx + 1} / {sessionData.questions.length}</h2>
             <TimerDisplay endTime={sessionData.totalEndTime} label="總剩餘" />
          </div>
          <div className="bg-white rounded-3xl shadow-xl border overflow-hidden mb-6 flex flex-col group">
            <div className="p-6 bg-indigo-50/50 border-b group-hover:bg-green-600 transition-colors">
              <div className="text-lg font-bold text-slate-800 group-hover:text-white transition-colors">{q.question}</div>
            </div>
            <div className="p-6">
              {renderQuestionContent()}
            </div>
          </div>
          <div className="flex gap-4">
            <button onClick={() => setLocalIdx(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} className="flex-1 px-4 py-3 bg-slate-200 rounded-2xl font-bold text-sm btn-quiz-action">上一個問題</button>
            <button onClick={handleNext} className="flex-1 px-4 py-3 bg-red-600 text-white rounded-2xl font-bold shadow-lg text-sm btn-quiz-action">{activeIdx === sessionData.questions.length-1 ? '再次檢查您的回覆' : '下一個問題'}</button>
          </div>
        </div>
      );
    }

    function TimerDisplay({ endTime, label }) {
      const [t, setT] = useState(0);
      useEffect(() => { if(!endTime) return; const tick = () => setT(Math.max(0, Math.floor((endTime - Date.now()) / 1000))); tick(); const i = setInterval(tick, 1000); return () => clearInterval(i); }, [endTime]);
      if(!endTime) return null;
      const m = Math.floor(t / 60).toString().padStart(2, '0');
      const s = (t % 60).toString().padStart(2, '0');
      return ( 
        <div className="px-2 py-1 bg-slate-100 rounded-lg text-center border">
          <div className="text-[8px] font-bold text-slate-400 uppercase">{label}</div>
          <div className="text-xs font-mono font-bold">{m}:{s}</div>
        </div> 
      );
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
