<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上問卷系統 - 專業優化版</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .btn-quiz-action {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-quiz-action:hover:not(:disabled) {
      background-color: #ef4444 !important; 
      color: white !important; 
      transform: scale(1.05); 
      z-index: 50;
      box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }
    .btn-quiz-action:active:not(:disabled) {
      transform: scale(0.95);
    }

    .choice-option-btn {
      transition: all 0.2s ease;
    }
    .choice-option-btn:hover:not(:disabled) {
      background-color: #16a34a !important;
      color: white !important;
      border-color: #15803d !important;
    }

    .question-header-hover:hover {
      background-color: #16a34a !important;
      color: white !important;
    }
    .question-header-hover:hover .question-text {
      color: white !important;
    }

    @media (max-width: 640px) {
      .mobile-full-height {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .question-box-limit {
        max-height: 35vh;
        overflow-y: auto;
      }
    }

    @keyframes scale-in {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scale-in {
      animation: scale-in 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Play, Square, Clock, Users, CheckCircle, ChevronRight, 
      ChevronLeft, Eye, ListChecks, ArrowRight, UserCircle, 
      LogOut, RefreshCw, Copy, Link as LinkIcon, Send, 
      Download, Upload, AlertTriangle, X, FileSearch, Edit3, Save, Lock, ClipboardList, Database, EyeOff, Calendar, LayoutList, BarChart3, PieChart, TrendingUp, Award, Table2, BookOpen, Sparkles, Calculator, Settings2, Trash2, ArrowUp, ArrowDown, ArrowUpDown
    } from 'https://esm.sh/lucide-react@0.292.0';

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, getDoc, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const appId = 'online-survey-system-v2'; // 更新版本

    const firebaseConfig = {
      apiKey: "AIzaSyC4jSIve5kj15hSptVFJ2hOdEjcQ0GsR6w",
      authDomain: "musictest-1c0fb.firebaseapp.com",
      projectId: "musictest-1c0fb",
      storageBucket: "musictest-1c0fb.firebasestorage.app",
      messagingSenderId: "416438714609",
      appId: "1:416438714609:web:806f72c2e2d40804442950",
      measurementId: "G-8NZLQDYY1N"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const getShareableUrl = (code) => {
      const url = new URL(window.location.href);
      url.searchParams.set('code', code);
      return url.toString();
    };

    const copyToClipboard = (text) => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      return true;
    };

    const AI_PROMPT_TEMPLATE = `你是一位專業的問卷轉換助手。請將我貼上的問題文字檔轉換為適合「線上問卷系統」使用的 JSON 格式。

規則如下：
1. 輸出格式必須是單純的 JSON 陣列 (Array)。
2. 選擇題：
   - "type" 設為 "choice"
   - "question" 為問題敘述
   - "options" 為包含 4 個選項的陣列（需保留編號，如 "1. 選項文字"）
   - "answer" 可設為預期答案編號數字字串 (例如 "1", "2", "3", "4") 或保留空白
3. 申論題：
   - "type" 設為 "essay"
   - "question" 為問題敘述
   - "answer" 為參考說明文字
4. 每一題必須包含遞增的 "id" 編號。

範例輸出格式：
[
  {
    "id": 1,
    "type": "choice",
    "question": "您對本次服務滿意嗎？",
    "options": ["1. 非常滿意", "2. 滿意", "3. 普通", "4. 不滿意"],
    "answer": "1"
  }
]`;

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [sessionCode, setSessionCode] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [sessionData, setSessionData] = useState(null);
      const [allAnswersData, setAllAnswersData] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [toastMsg, setToastMsg] = useState('');
      const [view, setView] = useState('main'); 
      
      const [quizBanks, setQuizBanks] = useState(() => {
        const saved = localStorage.getItem('secure_survey_banks_v2');
        return saved ? JSON.parse(saved) : {};
      });

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      useEffect(() => {
        signInAnonymously(auth).catch(() => setErrorMsg("連線失敗：請檢查網路。"));
        onAuthStateChanged(auth, setUser);
      }, []);

      useEffect(() => {
        if (!user || !sessionCode) return;
        const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', sessionCode);
        const unsubS = onSnapshot(sRef, (snap) => {
          if (snap.exists()) { setSessionData(snap.data()); } 
          else if (role === 'customer') { setRole(null); setSessionCode(''); setErrorMsg('問卷已關閉。'); }
        });

        const aRef = collection(db, 'artifacts', appId, 'public', 'data', 'answers');
        const unsubA = onSnapshot(aRef, (snap) => {
          const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setAllAnswersData(docs.filter(a => a.sessionId === sessionCode));
        });
        return () => { unsubS(); unsubA(); };
      }, [user, sessionCode, role]);

      const handleCreate = async () => {
        if (Object.keys(quizBanks).length === 0) {
          setErrorMsg("請先匯入問卷 JSON。");
          return;
        }
        const firstBankKey = Object.keys(quizBanks)[0];
        const currentBank = quizBanks[firstBankKey];
        const newCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', newCode), {
            hostId: user.uid, status: 'lobby', quizBankId: firstBankKey, quizTitle: currentBank.name || "未命名問卷",
            questions: currentBank.questions.map(q => ({ ...q, weight: 10 })), 
            currentQuestionIndex: 0, 
            perQuestionUnit: 'unlimited', perQuestionValue: 5,
            totalQuizUnit: 'minutes', totalQuizValue: 30,
            revealedAnswers: [], createdAt: Date.now(),
            gradingStep: 0, 
            scoringMode: 'even' 
          });
          setSessionCode(newCode); setRole('sender');
        } catch (e) { setErrorMsg("建立失敗。"); }
      };

      const handleJoin = async (code, name) => {
        if (!code || !name) return setErrorMsg('請填寫資訊');
        const c = code.trim().toUpperCase();
        const n = name.trim();
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', c));
          if (!snap.exists()) return setErrorMsg('找不到代碼。');
          const customerId = `${user.uid}_${n}`;
          const answerRef = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${c}_${customerId}`);
          const answerSnap = await getDoc(answerRef);
          if (!answerSnap.exists()) {
            await setDoc(answerRef, { sessionId: c, studentId: customerId, studentName: n, answers: {}, status: 'in_progress', joinedAt: Date.now() });
          }
          setSessionCode(c); setCustomerName(n); setRole('customer');
        } catch (e) { setErrorMsg("加入失敗。"); }
      };

      if (!user) return <div className="h-screen flex items-center justify-center text-slate-400 font-bold animate-pulse">Connecting...</div>;

      return (
        <div className="min-h-screen flex flex-col mobile-full-height">
          <header className="bg-indigo-900 text-white p-4 shadow-lg flex justify-between items-center shrink-0">
            <h1 className="font-bold flex items-center gap-2 text-sm md:text-lg"><ListChecks /> 線上問卷系統</h1>
            {role && (
              <div className="bg-indigo-800 px-3 py-1 rounded-full flex gap-3 text-xs md:text-sm items-center">
                <span>{role === 'sender' ? '發送者管理端' : customerName}</span>
                <span className="font-mono text-yellow-300 font-bold">{sessionCode}</span>
                <button onClick={()=>{setRole(null); setSessionCode(''); setView('main');}} className="bg-red-500 hover:bg-red-600 px-2 py-0.5 rounded text-[10px] btn-quiz-action">離開</button>
              </div>
            )}
          </header>

          <main className="flex-1 max-w-7xl mx-auto p-2 md:p-8 w-full overflow-y-auto custom-scrollbar">
            {view === 'analysis' ? (
              <AnalysisDashboard onBack={() => setView('main')} currentStudents={allAnswersData} showToast={showToast} session={sessionData} />
            ) : (
              <>
                {!role && <RoleSelection onJoin={handleJoin} onCreate={handleCreate} onResume={(c)=>{setSessionCode(c.toUpperCase()); setRole('sender');}} hasBanks={Object.keys(quizBanks).length > 0} onImport={(b)=>{setQuizBanks(b); localStorage.setItem('secure_survey_banks_v2', JSON.stringify(b)); showToast('格式載入成功');}} />}
                
                {role === 'sender' && sessionData && (
                  <SenderView code={sessionCode} session={sessionData} students={allAnswersData} db={db} showToast={showToast} quizBanks={quizBanks} setQuizBanks={(b)=>{setQuizBanks(b); localStorage.setItem('secure_survey_banks_v2', JSON.stringify(b));}} onGoAnalysis={() => setView('analysis')} />
                )}
                
                {role === 'customer' && sessionData && (
                  <CustomerDashboard 
                    sessionData={sessionData} 
                    myData={allAnswersData.find(a => a.studentId === `${user.uid}_${customerName}`)} 
                    onAnswer={(idx, text) => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${customerName}`);
                      updateDoc(ref, { [`answers.${idx}`]: text });
                    }} 
                    onFinalSubmit={async () => {
                      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'answers', `${sessionCode}_${user.uid}_${customerName}`);
                      await updateDoc(ref, { status: 'submitted', submittedAt: Date.now() });
                      showToast('問卷已成功回傳！');
                    }}
                    showToast={showToast}
                  />
                )}
              </>
            )}
          </main>

          {errorMsg && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[100]"><div className="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-scale-in"><AlertTriangle className="mx-auto text-red-500 mb-4 w-10 h-10" /><p className="font-bold">{errorMsg}</p><button onClick={()=>setErrorMsg('')} className="mt-6 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold btn-quiz-action w-full">確認</button></div></div>}
          {toastMsg && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl animate-bounce z-50 flex items-center gap-2 text-sm"><CheckCircle className="text-green-400 w-4 h-4" />{toastMsg}</div>}
        </div>
      );
    }

    function RoleSelection({ onJoin, onCreate, onResume, hasBanks, onImport }) {
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [resCode, setResCode] = useState('');
      const [isCustomerLink, setIsCustomerLink] = useState(false);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');
        if (codeFromUrl) {
          setCode(codeFromUrl.toUpperCase());
          setIsCustomerLink(true);
        }
      }, []);

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            let normalized = {};
            if (Array.isArray(data)) { normalized = { "custom": { name: file.name.replace('.json',''), questions: data } }; } 
            else if (data.questions && Array.isArray(data.questions)) { normalized = { "custom": data }; } 
            else { normalized = data; }
            onImport(normalized);
          } catch(err) { alert('JSON 格式錯誤'); }
        };
        reader.readAsText(file);
      };

      return (
        <div className={`mt-4 md:mt-10 ${isCustomerLink ? 'flex justify-center' : 'grid md:grid-cols-2 gap-4 md:gap-8'}`}>
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 w-full max-w-md animate-scale-in">
            <h2 className="text-xl md:text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2"><UserCircle /> 客戶登入</h2>
            <div className="space-y-4">
              <input type="text" placeholder="您的稱呼 / 公司名稱" className="w-full p-3 md:p-4 bg-slate-50 border rounded-2xl outline-none" value={name} onChange={e => setName(e.target.value)} />
              <input type="text" placeholder="輸入 4 碼問卷代碼" className="w-full p-3 md:p-4 bg-slate-50 border rounded-2xl font-mono uppercase outline-none" value={code} onChange={e => setCode(e.target.value)} />
              <button onClick={() => onJoin(code, name)} className="w-full bg-indigo-600 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg btn-quiz-action">進入問卷系統</button>
            </div>
          </div>
          {!isCustomerLink && (
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between bg-gradient-to-br from-indigo-50/50 to-white animate-scale-in">
              <div>
                <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Users /> 發送者管理端</h2>
                <div className="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 mb-4 text-center">
                  <label className="bg-white border-2 border-dashed border-indigo-200 p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-100 transition-colors">
                     <Upload className="text-indigo-400 mb-1 w-5 h-5" />
                     <span className="text-indigo-700 font-bold text-xs">{hasBanks ? '變更問卷檔案' : '匯入問卷內容 (JSON)'}</span>
                     <input type="file" className="hidden" accept=".json" onChange={handleImportFile}/>
                  </label>
                </div>
                <div className="space-y-2">
                  <button onClick={onCreate} className="w-full bg-slate-800 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg btn-quiz-action">建立新問卷</button>
                  <button onClick={() => { copyToClipboard(AI_PROMPT_TEMPLATE); alert('AI 提示詞已複製！'); }} className="w-full bg-indigo-50 text-indigo-700 py-3 rounded-2xl font-bold text-xs border border-indigo-200 flex items-center justify-center gap-2">
                    <Sparkles className="w-4 h-4" /> 複製 AI 轉檔提示詞
                  </button>
                </div>
              </div>
              <div className="mt-6 border-t pt-4">
                <div className="flex gap-2">
                  <input type="text" placeholder="恢復代碼" className="flex-1 p-2 border rounded-xl font-mono uppercase text-sm outline-none" value={resCode} onChange={e => setResCode(e.target.value)} />
                  <button onClick={() => onResume(resCode)} className="bg-indigo-100 text-indigo-700 font-bold px-4 rounded-xl btn-quiz-action text-sm">恢復</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SenderView({ code, session, students, db, showToast, quizBanks, setQuizBanks, onGoAnalysis }) {
      const [showFullBankPreview, setShowFullBankPreview] = useState(false);
      const [showResultsModal, setShowResultsModal] = useState(false);
      const [showAiHelper, setShowAiHelper] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editForm, setEditForm] = useState({ question: '', answer: '', options: [], weight: 10 });
      
      const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code);

      const saveEdit = async () => {
        const updatedQuestions = [...session.questions];
        updatedQuestions[editingIndex] = { ...updatedQuestions[editingIndex], ...editForm };
        
        // 更新本地與遠端
        const updatedBanks = { ...quizBanks };
        if (updatedBanks[session.quizBankId]) {
          updatedBanks[session.quizBankId].questions = updatedQuestions;
          setQuizBanks(updatedBanks);
        }
        await updateDoc(sRef, { questions: updatedQuestions });
        setEditingIndex(null); 
        showToast('問卷內容已即時更新！');
      };

      const exportJSON = (data, name) => {
        const dataToExport = data.map(record => ({
          ...record,
          quizTitle: session.quizTitle
        }));
        const jsonStr = JSON.stringify(dataToExport, null, 2);
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr);
        const anchor = document.createElement('a'); 
        anchor.setAttribute("href", dataStr); 
        anchor.setAttribute("download", `${name}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
      };

      return (
        <div className="space-y-6 animate-scale-in">
          {showFullBankPreview && (
            <div className="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
               <div className="bg-white w-full max-w-5xl h-full rounded-[2.5rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-6 md:p-8 border-b flex justify-between items-center bg-slate-50">
                    <h2 className="text-xl md:text-2xl font-black text-indigo-900 flex items-center gap-2"><FileSearch /> 編輯問卷內容</h2>
                    <button onClick={() => { setShowFullBankPreview(false); setEditingIndex(null); }} className="p-2 bg-red-50 text-red-500 rounded-full"><X /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar space-y-4 bg-slate-100/30">
                    {session.questions?.map((q, idx) => (
                      <div key={idx} className={`bg-white p-6 rounded-3xl border transition-all ${editingIndex === idx ? 'border-indigo-500 ring-4 ring-indigo-50' : 'border-slate-200'}`}>
                        <div className="flex gap-4">
                          <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black shrink-0 ${editingIndex === idx ? 'bg-indigo-600 text-white' : 'bg-indigo-100 text-indigo-700'}`}>{idx+1}</div>
                          <div className="flex-1">
                            {editingIndex === idx ? (
                              <div className="space-y-4">
                                <textarea className="w-full p-3 border rounded-xl h-20 outline-none" value={editForm.question} onChange={e=>setEditForm({...editForm, question: e.target.value})}/>
                                {q.type === 'choice' && (
                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    {[0,1,2,3].map(i => (
                                      <input key={i} type="text" className="p-2 border rounded-lg text-sm" value={editForm.options[i] || ''} onChange={e=>{
                                        const newOpts = [...editForm.options]; newOpts[i] = e.target.value; setEditForm({...editForm, options: newOpts});
                                      }} placeholder={`選項 ${i+1}`} />
                                    ))}
                                  </div>
                                )}
                                <div className="flex gap-2"><button onClick={saveEdit} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold btn-quiz-action">儲存修改</button><button onClick={()=>setEditingIndex(null)} className="bg-slate-200 px-6 py-2 rounded-xl">取消</button></div>
                              </div>
                            ) : (
                              <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-md font-bold">{q.question}</p>
                                    {q.type === 'choice' && <div className="grid grid-cols-2 gap-2 mt-2">{q.options?.map((opt, i) => <div key={i} className="text-xs text-slate-500 bg-slate-50 p-2 rounded-lg border">{opt}</div>)}</div>}
                                </div>
                                <button onClick={()=> { setEditingIndex(idx); setEditForm({question:q.question, answer:q.answer, options: q.options || [], weight: q.weight || 10}); }} className="p-2 text-slate-400 hover:text-indigo-600 btn-quiz-action bg-slate-50 rounded-xl border"><Edit3 className="w-5 h-5"/></button>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
               </div>
            </div>
          )}

          {showResultsModal && (
            <div className="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-2 backdrop-blur-md">
               <div className="bg-white w-full max-w-7xl h-full rounded-[2rem] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                  <div className="p-6 border-b flex justify-between items-center bg-indigo-50">
                    <h2 className="text-xl font-black text-indigo-900 flex items-center gap-2"><ClipboardList /> 客戶回答詳情</h2>
                    <div className="flex gap-2">
                       <button onClick={()=>exportJSON(students, `${session.quizTitle}_資料匯出`)} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold btn-quiz-action text-xs"><Database className="w-4 h-4 inline mr-1"/> 匯出 JSON</button>
                       <button onClick={() => setShowResultsModal(false)} className="p-2 border rounded-full"><X /></button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-auto p-4 custom-scrollbar">
                    <table className="w-full text-left border-collapse min-w-[1000px]">
                      <thead><tr className="bg-slate-800 text-white text-[10px]"><th className="p-3 sticky left-0 bg-slate-800">客戶名稱</th><th className="p-3 text-center">狀態</th>{session.questions.map((_, i) => <th key={i} className="p-3 border-l border-slate-700">Q{i+1}</th>)}</tr></thead>
                      <tbody>{students.map((s, idx) => (<tr key={idx} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b text-xs`}><td className="p-3 font-bold sticky left-0 bg-inherit shadow-md text-indigo-800">{s.studentName}</td><td className="p-3 text-center">{s.status === 'submitted' ? '✅ 已送出' : '📝 填寫中'}</td>{session.questions.map((_, i) => (<td key={i} className="p-3 border-l text-slate-600 truncate max-w-[200px]">{s.answers?.[i] || '-'}</td>))}</tr>))}</tbody>
                    </table>
                  </div>
               </div>
            </div>
          )}

          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <h2 className="text-xl font-bold text-indigo-900 mb-4">主控台</h2>
            <div className="p-3 bg-indigo-50 rounded-xl border border-indigo-100 flex items-center gap-2 mb-6 text-xs">
              <span className="font-bold text-indigo-800">客戶線上回答網址:</span>
              <input type="text" readOnly className="flex-1 bg-white p-2 rounded border" value={getShareableUrl(code)} />
              <button onClick={() => { copyToClipboard(getShareableUrl(code)); showToast('已複製！'); }} className="bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-bold btn-quiz-action">複製</button>
            </div>

            {session.status === 'lobby' ? (
              <div className="grid md:grid-cols-2 gap-4">
                 <div className="space-y-2">
                    <button onClick={() => setShowFullBankPreview(true)} className="w-full bg-white border-2 border-indigo-600 text-indigo-600 p-3 rounded-xl text-sm font-bold btn-quiz-action">編輯問卷內容</button>
                    <button onClick={onGoAnalysis} className="w-full bg-indigo-100 border-2 border-indigo-300 text-indigo-700 p-3 rounded-xl text-sm font-bold btn-quiz-action">進入回答分析</button>
                 </div>
                 <div className="flex flex-col gap-2">
                    <button onClick={() => updateDoc(sRef, { status: 'sync_active', currentQuestionIndex: 0, totalEndTime: Date.now() + (session.totalQuizValue * 60000) })} className="bg-indigo-600 text-white py-3 rounded-2xl font-bold btn-quiz-action text-sm">客戶統一時間同步回答模式</button>
                    <button onClick={() => updateDoc(sRef, { status: 'submission_mode', totalEndTime: null })} className="bg-emerald-600 text-white py-3 rounded-2xl font-bold btn-quiz-action text-sm">客戶有空再回答模式</button>
                 </div>
              </div>
            ) : (
              <div className="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl">
                 <div className="flex flex-col text-sm"><span className="text-indigo-400 font-bold uppercase tracking-widest">{session.status === 'submission_mode' ? '自由回答中' : '同步調查中'}</span><p>{session.quizTitle}</p></div>
                 <div className="flex gap-2">
                   <button onClick={onGoAnalysis} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold btn-quiz-action">分析</button>
                   <button onClick={() => updateDoc(sRef, { status: 'review', totalEndTime: null })} className="bg-red-500 text-white px-6 py-2 rounded-xl text-xs font-bold btn-quiz-action">結束問卷</button>
                 </div>
              </div>
            )}
          </div>
          
          <div className="grid lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white p-6 rounded-3xl border">
               <h3 className="text-lg font-bold border-b pb-2 mb-4">當前問題: Q{session.currentQuestionIndex+1}</h3>
               <p className="text-2xl font-bold text-slate-700 leading-relaxed">{session.questions?.[session.currentQuestionIndex]?.question}</p>
            </div>
            <div className="bg-white p-6 rounded-3xl border h-[300px] overflow-y-auto custom-scrollbar">
               <h3 className="text-sm font-bold text-slate-400 mb-4 flex justify-between">在線客戶 <span>{students.length} 人</span></h3>
               {students.map(s => (<div key={s.id} className="p-2 bg-slate-50 rounded-xl border mb-2 text-sm font-bold flex justify-between">{s.studentName} {s.status === 'submitted' && <span className="text-emerald-500">✅</span>}</div>))}
            </div>
          </div>
        </div>
      );
    }

    function AnalysisDashboard({ onBack, currentStudents, showToast, session }) {
      const questions = session?.questions || [];
      return (
        <div className="animate-scale-in space-y-6 max-w-[1600px] mx-auto pb-10">
          <div className="flex justify-between items-center bg-white p-6 rounded-3xl border shadow-sm">
            <h2 className="text-2xl font-black text-indigo-900 flex items-center gap-2"><BarChart3 /> 客戶回答分析</h2>
            <button onClick={onBack} className="bg-slate-800 text-white px-5 py-2.5 rounded-2xl font-bold btn-quiz-action">返回</button>
          </div>
          <div className="bg-white p-6 rounded-[2rem] border overflow-x-auto">
             <table className="w-full text-xs">
                <thead className="bg-slate-100"><tr><th className="p-3 text-left">客戶姓名</th>{questions.map((_, i) => <th key={i} className="p-3">Q{i+1}</th>)}</tr></thead>
                <tbody>{currentStudents.map((s, idx) => (<tr key={idx} className="border-b"><td className="p-3 font-bold">{s.studentName}</td>{questions.map((_, i) => <td key={i} className="p-3 text-center text-slate-500">{s.answers?.[i] || '-'}</td>)}</tr>))}</tbody>
             </table>
          </div>
        </div>
      );
    }

    function CustomerDashboard({ sessionData, myData, onAnswer, onFinalSubmit, showToast }) {
      const [localIdx, setLocalIdx] = useState(0);
      const [showOverview, setShowOverview] = useState(false);
      const [text, setText] = useState('');
      const activeIdx = localIdx;
      const q = sessionData.questions?.[activeIdx] || {};

      useEffect(() => { if (myData) setText(myData.answers?.[activeIdx] || ''); }, [activeIdx, myData]);
      useEffect(() => { 
        if (sessionData.status === 'sync_active') { 
            setLocalIdx(sessionData.currentQuestionIndex); 
            setShowOverview(false); 
        } 
      }, [sessionData.currentQuestionIndex, sessionData.status]);

      const handleSaveAndNext = () => {
        onAnswer(activeIdx, text); 
        
        // ------------------ 跳題邏輯 ------------------
        // 第 3 題 (Index 2): 如果回答 2 或 4，跳到第 5 題 (Index 4)
        if (activeIdx === 2 && (text === '2' || text === '4')) {
            if (4 < sessionData.questions.length) {
                setLocalIdx(4);
                return;
            }
        }
        // ---------------------------------------------

        if (activeIdx < sessionData.questions.length - 1) {
            setLocalIdx(prev => prev + 1); 
        } else {
            setShowOverview(true); 
        }
      };

      const isSubmitted = myData?.status === 'submitted';
      if (sessionData.status === 'lobby') return <div className="h-[60vh] flex items-center justify-center font-bold">等待發送者開啟問卷...</div>;

      if (showOverview) {
        return (
          <div className="max-w-2xl mx-auto p-4 bg-white rounded-3xl shadow-xl animate-scale-in border flex flex-col h-[85vh]">
            <h2 className="text-xl font-bold border-b pb-4 flex items-center gap-2 text-indigo-900"><LayoutList /> 檢查回答內容</h2>
            <div className="flex-1 overflow-y-auto space-y-3 my-4 pr-2 custom-scrollbar">
              {sessionData.questions.map((q, i) => {
                const ansKey = myData?.answers?.[i];
                // 如果是選擇題，顯示完整的選項文字
                let displayVal = ansKey || <span className="text-red-500 italic">尚未填寫</span>;
                if (q.type === 'choice' && ansKey) {
                    const optIdx = parseInt(ansKey) - 1;
                    if (q.options?.[optIdx]) {
                        displayVal = q.options[optIdx];
                    }
                }

                return (
                  <div key={i} className={`p-4 rounded-2xl border transition-all ${myData?.answers?.[i] ? 'bg-indigo-50' : 'bg-red-50'}`}>
                    <div className="text-xs text-slate-500 font-bold mb-1">Q{i+1}. {q.question}</div>
                    <p className="text-sm font-bold text-slate-800 bg-white/70 p-2 rounded-lg border">{displayVal}</p>
                  </div>
                );
              })}
            </div>
            <div className="flex gap-4 pt-4 border-t">
              <button onClick={() => { setLocalIdx(0); setShowOverview(false); }} className="flex-1 p-4 bg-slate-800 text-white rounded-2xl font-bold btn-quiz-action">重新作答</button>
              <button onClick={() => { if(window.confirm('確定送出？')){ onFinalSubmit(); setShowOverview(false); } }} className="flex-1 p-4 bg-red-600 text-white rounded-2xl font-bold btn-quiz-action shadow-lg">正式送出</button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto px-2 pb-10 animate-scale-in">
          {isSubmitted && <div className="bg-emerald-600 text-white p-3 rounded-2xl text-center font-black text-sm mb-4">感謝參與，問卷已回傳！</div>}
          <div className="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center mb-4">
             <div className="flex flex-col"><span className="text-[10px] font-bold text-indigo-500">{sessionData.quizTitle}</span><h2 className="text-md font-bold">問題 {activeIdx + 1} / {sessionData.questions.length}</h2></div>
          </div>
          <div className="bg-white rounded-3xl shadow-xl border overflow-hidden mb-6 flex flex-col group">
            <div className="p-6 bg-indigo-50/50 border-b group-hover:bg-green-600 transition-colors">
              <div className="text-lg md:text-xl font-bold text-slate-800 question-text">{q.question}</div>
            </div>
            <div className="p-6 bg-white">
              {q.type === 'choice' ? (
                <div className="grid grid-cols-1 gap-3">
                  {q.options?.map((opt, i) => {
                    const val = (i+1).toString();
                    return (
                      <button key={i} disabled={isSubmitted} onClick={()=>{ setText(val); onAnswer(activeIdx, val); }} className={`p-4 rounded-2xl border-2 font-bold text-left text-sm transition-all ${text === val ? 'bg-green-600 text-white border-green-700 shadow-lg' : 'bg-white border-slate-200'} btn-quiz-action`}>{opt}</button>
                    );
                  })}
                </div>
              ) : (
                <textarea className="w-full p-4 border-2 rounded-2xl outline-none text-md h-32 font-medium focus:border-green-500" placeholder="請在此輸入..." value={text} onChange={e => setText(e.target.value)} onBlur={() => onAnswer(activeIdx, text)} disabled={isSubmitted} />
              )}
            </div>
          </div>
          <div className="flex gap-4">
            <button onClick={() => setLocalIdx(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} className="flex-1 px-4 py-3 bg-slate-200 rounded-2xl font-bold btn-quiz-action text-sm">上一個問題</button>
            <button onClick={handleSaveAndNext} className="flex-1 px-4 py-3 bg-red-600 text-white rounded-2xl font-bold btn-quiz-action shadow-lg text-sm">{activeIdx === sessionData.questions.length-1 ? '再次檢查您的回覆' : '下一個問題'}</button>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
